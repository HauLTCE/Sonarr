# Prod stack — lives at /root/sonarr-net/docker-compose.yml on the server (docs/11-deployment.md).
#
# Everything in one bucket as of 2026-07-28: bot, panel, Postgres, Redis, Lavalink and
# yt-cipher. Music used to be deliberately excluded (Lavalink ran as systemd
# `lavalink.service` out of /root/lavalink, yt-cipher as a hand-started container) so a
# rewrite deploy could never take music down. That trade is over — one `compose up` now
# brings up or tears down the whole thing, and the node config lives in git at
# deploy/lavalink/application.yml instead of only on the box.
#
# Every service uses `network_mode: host`, so they reach each other on 127.0.0.1 and the
# published ports below are informational for the host, not container-to-container plumbing.
name: sonarr

services:
  bot:
    image: ${BOT_IMAGE:-sonarr-bot:local}
    # Built by deploy/deploy.sh, which rsyncs the sources into ./repo; GHCR pull once CI lands.
    build:
      context: ./repo
      dockerfile: src/Sonarr.Bot/Dockerfile
    # Host networking: same reachability the old systemd bot had (Lavalink on 127.0.0.1:2333).
    # Side effect: the API listens on the host's :5088 directly — no port mapping applies.
    network_mode: host
    env_file: .env
    volumes:
      - ./persona:/app/persona          # hot-reloadable persona (docs/10)
      - ./models:/app/models:ro         # ONNX embedder, fetched by scripts/fetch-model.sh (docs/03)
      - /root/backups/sonarr:/backups   # BackupRunner writes here (docs/11)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not service_healthy: Lavalink takes ~20 s to boot and the bot reconnects to a node
      # on its own anyway (that is what the old reconnect spam in the journal was). Waiting
      # would only delay the gateway coming up.
      lavalink:
        condition: service_started
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-sonarr-web:local}
    # Same ./repo tree deploy.sh rsyncs for the bot image; web/ rides along.
    build:
      context: ./repo/web
      dockerfile: Dockerfile
    # Host networking, like the bot: that is what makes 127.0.0.1:5088 below the API rather
    # than this container talking to itself. No port mapping applies as a result — HOSTNAME
    # is what keeps :3000 on loopback, where the user's tunnel picks it up.
    network_mode: host
    environment:
      # Server-side calls only; the panel never gets DB creds or the Discord token (docs/06).
      SONARR_API_URL: http://127.0.0.1:5088
      HOSTNAME: 127.0.0.1       # user's tunnel maps sonarr.hault.io.vn -> :3000
      PORT: 3000
    depends_on: [bot]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:5432:5432"   # loopback only; bot uses host networking so it reaches this fine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  lavalink:
    # Pinned, not :latest — an audio node that silently changes version under a working bot
    # is the worst kind of surprise. This is the version that has been serving music since May.
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    # Host networking to match everything else: the youtube plugin's remoteCipher points at
    # 127.0.0.1:8001 (yt-cipher below), and the bot reaches this node on 127.0.0.1:2333.
    network_mode: host
    environment:
      # Keeps the node password out of the committed application.yml. Spring Boot maps this
      # env var onto lavalink.server.password.
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?required}
      # 4.2.2 needs a JVM heap ceiling or it sizes off total host RAM — 512m is comfortable
      # for a handful of players and leaves room for the bot on a 4 GB box.
      JAVA_OPTS: -Xmx512m
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # ponytail: no volume for /opt/Lavalink/plugins, so the youtube plugin jar named in
      # application.yml is re-downloaded on every container recreate (~5 MB, a few seconds).
      # A named volume is the obvious thing and it is what broke this deploy: the image has
      # no /opt/Lavalink/plugins for Docker to seed permissions from, so a fresh volume
      # lands root-owned while the image runs as uid 322(lavalink), and the node crashloops
      # on "youtube-plugin-1.18.1.jar (Permission denied)". Fixing that needs a host-side
      # `chown 322` that lives nowhere in git and would be forgotten on the J2900 move.
      # /opt/Lavalink is lavalink-owned, so with no mount the container just creates the
      # directory itself and a clean checkout works with zero manual steps.
      # Ceiling: recreates depend on GitHub being reachable. If that ever bites, bind-mount
      # ./lavalink/plugins and chown it 322:322 in deploy.sh so the fix stays in the repo.
    healthcheck:
      # Every endpoint needs the password, /version included — an unauthenticated probe gets
      # a 401, which wget reports as failure, so the node sat "unhealthy" while happily
      # serving. The password comes from the container's own environment rather than being
      # written here, so it never reaches a compose file or `docker inspect` output beyond
      # where it already is. CMD-SHELL because this needs $VAR expansion.
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://127.0.0.1:2333/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  yt-cipher:
    # Solves YouTube's signature ciphers out of process for the youtube plugin above.
    #
    # Pinned by digest because upstream only publishes a moving `master` tag: this is the
    # exact image that has been working on the CT. Bump it deliberately when YouTube breaks
    # playback (`docker pull ghcr.io/kikkia/yt-cipher:master` then re-pin), not by accident
    # on an unrelated redeploy.
    image: ghcr.io/kikkia/yt-cipher@sha256:996a71e8d78476f5d7e2f2ae04fd3cbd06c7a1ee7c4c0d3e8302303d1cd096af
    network_mode: host
    environment:
      # Same value the hand-started container ran with on the CT.
      OVERRIDE_PLAYER_VARIANT: IAS
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
