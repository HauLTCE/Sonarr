# E.L.A.I.N.E — troll-bot personality (rich edition).
# Recursive grammar drives live reply:/on_enter: output, with mode-conditioned tone,
# episodic receipts (#recall#), and affect-gated routing. No LLM — every word authored.
#
# The bulk of the response variety comes from imported pools (see include:) — ~160
# categories, 3000+ lines lifted from the sonarr bot, effects stripped, reachable as
# #pool_name# grammar symbols from any state. CHAT routes a broad set of conversational
# intents (topics, questions, emotions, small talk, statements) to those pools so she can
# hold a normal back-and-forth in one turn per message — still dismissive, never broken.

start: GREET

# Shared response pools (generated by tools/import_sonarr.py). Reachable as #symbol#.
# _extra_pools.yaml holds hand-authored additions (new topics, games, mood report).
include:
  - _sonarr_pools.yaml
  - _extra_pools.yaml

# COOLDOWN is entered by the affect layer (anger >= cooldown threshold), not a goto edge.
affect_states: [COOLDOWN]

personality:
  baselines: { anger: 0, warmth: 3, amusement: 2, boredom: 0, confidence: 6, energy: 5 }
  decay:     { anger: 0.5, warmth: 0.2, amusement: 0.4, boredom: 0.55, confidence: 0.1, energy: 0.25 }
  bleed:     { global_to_user: 0.4 }
  flips:
    nemesis:  { enter: -4, exit: 2 }
    favorite: { enter: 6, exit: 3 }
  cooldown:  { enter_anger: 7.5, duration_msgs: 5 }
  decay_cap: 50

# Swappable presets: `elaine --script ... --personality nice|feral|deadpan`.
# Each is merged over the base `personality:` block above (nested keys override).
personalities:
  nice:
    baselines: { warmth: 7, amusement: 4, energy: 6 }
    decay:     { anger: 0.8, warmth: 0.1 }
    cooldown:  { enter_anger: 9.5, duration_msgs: 2 }
  feral:
    baselines: { anger: 2, warmth: 1, amusement: 3, confidence: 8, energy: 7 }
    decay:     { anger: 0.2, confidence: 0.05 }
    cooldown:  { enter_anger: 6, duration_msgs: 6 }
  deadpan:
    baselines: { warmth: 2, amusement: 0, boredom: 3, energy: 3 }
    decay:     { amusement: 0.6, boredom: 0.2 }

modes:
  SEETHING: { all: ["anger >= 7"] }
  ANNOYED:  { all: ["anger >= 4"] }
  BORED:    { all: ["boredom >= 6"] }
  # PETTY: lingering post-fight passive-aggression (needs a real history of insults).
  PETTY:    { all: ["times_insulted >= 6", "anger < 4"] }
  # SMUG: rides high after being complimented / winning arguments (confidence climbs).
  SMUG:     { all: ["confidence >= 8", "anger < 4"] }
  PLAYFUL:  { all: ["amusement >= 6", "anger < 4"] }
  FOND:     { all: ["relationship >= 5", "trust >= 5"] }
  NEUTRAL:  { always: true }

intents:
  AFFIRM:    { keyword: [yes, yeah, sure, ok, okay, yep, yup, fine, alright, kk] }
  DENY:      { keyword: [no, nope, nah, never] }
  INSULT:    { keyword: [stupid, dumb, idiot, trash, useless, loser, clown, npc], fuzzy_keyword: [pathetic, worthless], max_distance: 2 }
  COMPLIMENT: { keyword: [smart, cool, nice, awesome, amazing, based, funny, clever, brilliant, goated, helpful, genius, legend, wholesome], fuzzy_keyword: [wonderful], max_distance: 2, regex: ["you'?re (?:the |so |really |pretty )?(?:best|great|goat|goated)", "you (?:rock|rule|slay)", "good bot", "well done", "nailed it"] }
  # cute/hot/beautiful only count as flirting when aimed at HER (regex), so "my dog is
  # cute" reads as a pet topic, not a pass at the bot.
  FLIRT:     { keyword: [marry, gorgeous, sexy], regex: ["i (?:like|love|luv) (?:you|u)\\b", "be my (?:gf|girlfriend|valentine|wife|bf|boyfriend)", "you'?re (?:so |really |very |pretty )?(?:cute|hot|gorgeous|beautiful|sexy|attractive|adorable)", "you are (?:so |really )?(?:cute|hot|gorgeous|beautiful|sexy|adorable)", "date me", "marry me", "wanna (?:date|kiss)", "you'?re my (?:type|crush|bae)"] }
  JOKE:      { keyword: [lol, lmao, haha, joke, kidding, jk, lmfao, rofl, hilarious], regex: ["ha ?ha"] }
  YOURMOM:   { regex: ["yo+ ?ma(?:ma|mma)", "your mom", "ur mom", "ya mum"] }
  KYS:       { regex: ["k+y+s+", "kill yourself", "neck yourself"] }
  THREAT:    { regex: ["i'?ll (?:end|destroy|find|beat|kill|hurt) you", "i'?m (?:gonna|going to) (?:kill|destroy|hurt|end|beat) you", "watch your (?:back|mouth)", "kick your"] }
  # Elongated forms ("hiii", "heyyy", "yoooo", "helloooo", "suup") are added as regexes so
  # drawn-out greetings still register (and count) — a bare keyword only matches the exact
  # token, so "hiii" used to fall through to the generic fallback and never hit the counter.
  # Each stem is anchored with \b and uses c+ runs; verified against a positives/negatives
  # list so words like "his", "you", "super", "help", "hell", "yolo" never false-match.
  GREETING:  { keyword: [hi, hello, hey, yo, sup, hiya, heya, howdy, greetings], regex: ["what'?s up", "whats up", "good (?:morning|evening|afternoon)", "\\bh+i+\\b", "\\bh+e+y+\\b", "\\by+o+\\b", "\\bs+u+p+\\b", "\\bh+e+l+o+\\b", "\\bh+i+y+a+\\b", "\\bh+e+y+a+\\b", "\\bh+o+w+d+y+\\b"] }
  BORED_IN:  { keyword: [bored, boring, dull], regex: ["nothing to do"] }
  BRAG:      { regex: ["i(?:'?m| am) (?:the )?(?:best|smartest|richest|greatest)", "i(?:'?m| am) better than", "i(?:'?m| am) (?:so )?rich", "i(?:'?m| am) a genius"] }
  BYE:       { keyword: [bye, goodbye, cya, later, gtg, peace, ttyl], regex: ["see ya", "i'?m (?:leaving|off|out)", "have to go", "gotta go", "good ?night"] }
  THANKS:    { keyword: [thanks, thx, ty, cheers], regex: ["thank (?:you|u|ya)", "appreciate (?:it|you|ya|that|this)"] }
  APOLOGY:   { keyword: [sorry], regex: ["my bad", "apolog", "didn'?t mean"] }
  SAD:       { keyword: [sad, depressed, crying, upset, unhappy, miserable, lonely, heartbroken, hopeless, grieving, devastated], regex: ["feel(?:ing)? (?:down|low|bad|awful|terrible|horrible)", "i lost my", "i failed", "going through", "hate my life", "want to cry", "died", "passed away", "(?:he|she|they|it) is dead"] }
  TIRED:     { keyword: [tired, exhausted, sleepy, drained, burnt], regex: ["can'?t sleep", "cant sleep", "no sleep", "so tired", "need (?:a nap|sleep|rest)", "up all night", "didn'?t sleep"] }
  HAPPY:     { keyword: [happy, excited, stoked, thrilled, ecstatic, pumped, hyped, yay, woohoo, elated], regex: ["so happy", "best day", "great news", "can'?t wait", "cant wait"] }
  CONFUSED:  { keyword: [confused, huh], regex: ["i (?:don'?t|do not|dont) (?:understand|get it|get this)", "what do you mean", "makes no sense", "i'?m lost", "im lost", "(?:don'?t|dont) know what to do", "no idea"] }
  DISAGREE:  { keyword: [wrong, incorrect, disagree], regex: ["i disagree", "you'?re wrong", "youre wrong", "that'?s (?:wrong|not right|false|not true)", "no way", "(?:don'?t|dont) think so", "not really"] }
  AGREE:     { keyword: [agreed, exactly, facts], regex: ["i agree", "you'?re right", "youre right", "that'?s true", "so true", "good point", "fair enough", "makes sense", "well said", "sounds good", "sounds right"] }
  WEATHER:   { keyword: [weather, raining, sunny, snowing, cloudy, humid, freezing], regex: ["it'?s (?:hot|cold|raining|snowing|sunny)", "so (?:hot|cold) (?:out|today)", "nice out", "the temperature"] }
  FOOD:      { keyword: [hungry, food, eat, eating, lunch, dinner, breakfast, snack, pizza, burger, tacos, sushi, starving], regex: ["what should i eat", "i'?m starving", "so hungry"] }
  MUSIC:     { keyword: [music, song, songs, album, artist, spotify, playlist, jazz, guitar], regex: ["listening to", "favorite song"] }
  SPORTS:    { keyword: [sports, football, soccer, basketball, baseball, hockey, tennis, nba, nfl, mlb, fifa, playoffs], regex: ["the game (?:last night|yesterday|tonight)", "watch(?:ed|ing)? the game", "my team"] }
  GAMING:    { keyword: [gaming, gamer, xbox, playstation, ps5, nintendo, steam, valorant, minecraft, fortnite, roblox], regex: ["video game", "playing (?:a |some |the )?game", "my rank"] }
  # regex-only (no bare "work"/"job" keyword) so "how does this work" / "good job" don't misfire.
  WORK:      { keyword: [boss, coworker, salary, overtime, deadline, promotion, workplace], regex: ["my job", "at work", "off work", "work (?:has|is|was|been|sucks|today)", "hate (?:my )?(?:job|work)", "my (?:work|boss)", "job interview", "long day at"] }
  SCHOOL:    { keyword: [school, class, classes, homework, exam, exams, teacher, college, university, professor, studying, assignment, semester], regex: ["my grades", "study for", "a test"] }
  PETS:      { keyword: [dog, dogs, cat, cats, puppy, kitten, pet, pets, hamster, goldfish], regex: ["my (?:dog|cat|pet)"] }
  SCIENCE:   { keyword: [science, physics, chemistry, biology, space, universe, planet, planets, galaxy, gravity, evolution, quantum], regex: ["black hole", "the moon", "outer space"] }
  TECH:      { keyword: [phone, phones, tablet, computer, laptop, internet, robot, robots, coding, programming, software, hardware, gadget, algorithm, wifi], regex: ["my (?:phone|computer|pc|laptop)", "new (?:phone|tech|laptop|computer)"] }
  SLEEP:     { keyword: [nap, insomnia, bedtime], regex: ["go(?:ing)? to (?:bed|sleep)", "going to nap", "can'?t sleep"] }
  RELATIONSHIP: { keyword: [girlfriend, boyfriend, dating, crush, breakup, tinder, hinge], regex: ["my (?:gf|bf|ex|partner|crush)", "in a relationship", "we broke up", "my relationship"] }
  PREFERENCE: { regex: ["i (?:like|love|enjoy|prefer|adore) ", "my favorite", "i'?m a fan of", "i (?:hate|dislike|can'?t stand|cant stand) "] }
  ADVICE:    { regex: ["what should i do", "should i ", "any advice", "help me decide", "what would you do", "give me advice"] }
  REQUEST:   { regex: ["can you ", "could you ", "would you ", "please ", "i (?:need|want) you to", "help me", "do me a favor", "give me "] }
  HOWRU:     { regex: ["how are you", "how'?re you", "how are u", "how you doing", "how'?s it going", "hows it going", "you (?:doing )?(?:ok|okay|good|alright)", "how do you feel"] }
  Q_REL:     { regex: ["do you (?:like|love|care about|hate|even like) me", "do you care", "are we (?:friends|dating|a thing|cool)", "am i your", "do you miss me", "do you have feelings for"] }
  Q_BOT:     { regex: ["who are you", "what are you", "your name", "are you (?:a )?(?:bot|ai|robot|human|real|person|machine)", "what'?s your name", "whats your name", "who (?:made|created) you"] }
  Q_AGE:     { regex: ["how old", "your age", "when were you born"] }
  Q_PHILO:   { regex: ["meaning of life", "why are we here", "what is love", "purpose of life", "is there a god", "what happens when we die", "free will"] }
  Q_CAP:     { regex: ["what can you do", "what do you do", "are you able to", "your capabilities", "what are you capable"] }
  Q_PRONOUN: { keyword: [pronouns], regex: ["your pronouns", "what pronouns", "how do i refer to you", "are you a (?:girl|woman|boy|man|guy|dude|she|he|female|male)", "you a (?:girl|guy|dude|boy)\\b", "he or she", "she or he"] }
  # --- new topics (batch of 50) ---
  MOVIES:    { keyword: [movie, movies, film, films, netflix, cinema, sitcom], regex: ["tv show", "watch(?:ed|ing)? (?:a |the )?(?:movie|show|series|netflix)", "favou?rite (?:movie|show|film)"] }
  ART:       { keyword: [art, painting, drawing, sculpture, museum, gallery, sketch, canvas, doodle], regex: ["i (?:paint|draw|sketch)"] }
  ASTROLOGY: { keyword: [zodiac, horoscope, astrology, retrograde, gemini, scorpio, aries, taurus, virgo, libra, pisces, capricorn, aquarius, sagittarius], regex: ["my sign", "star sign", "mercury retrograde"] }
  CONSPIRACY: { keyword: [conspiracy, illuminati, aliens, ufo, chemtrails, simulation, reptilian], regex: ["the government", "flat earth", "wake up sheeple", "they don'?t want you to know"] }
  DREAMS:    { keyword: [dream, dreams, nightmare, dreamt, dreaming], regex: ["had a dream", "weird dream"] }
  DRINKS:    { keyword: [thirsty, coffee, tea, beer, wine, soda, juice, drinks, alcohol, cocktail, latte, espresso, hydrated], regex: ["a drink", "grab a"] }
  FASHION:   { keyword: [fashion, outfit, clothes, clothing, shoes, sneakers, wardrobe], regex: ["what should i wear", "my outfit", "dressed up", "new (?:shoes|clothes|fit)"] }
  MATH:      { keyword: [math, algebra, calculus, geometry, equation, arithmetic, maths], regex: ["\\d+ ?[+\\-*x] ?\\d+", "do the math", "solve this"] }
  NOSTALGIA: { keyword: [nostalgia, childhood, nostalgic], regex: ["back in my day", "good old days", "when i was (?:a kid|young|little)", "remember when", "used to (?:be|play|watch|love)"] }
  ANIME:     { keyword: [anime, manga, gacha, waifu, weeb, otaku, genshin, arknights, cosplay, husbando], regex: ["my waifu", "pulled (?:for|on)"] }
  COOKING:   { keyword: [cooking, cook, baking, bake, recipe, kitchen, oven, chef, grill], regex: ["i (?:cooked|baked|made)", "in the kitchen"] }
  EXISTENTIAL: { keyword: [existential, meaningless, nihilism, void], regex: ["what'?s the point", "why do i exist", "nothing matters", "we'?re all going to die", "life is meaningless"] }
  WORKOUT:   { keyword: [gym, workout, exercise, lifting, cardio, gains, squat, deadlift, treadmill, pushups], regex: ["work(?:ing)? out", "leg day", "hit the gym"] }
  NATURE:    { keyword: [hiking, hike, camping, outdoors, forest, mountains, trail, wilderness], regex: ["the outdoors", "went outside", "in nature"] }
  TRAVEL:    { keyword: [travel, traveling, travelling, vacation, trip, flight, airport, tourist, abroad, passport], regex: ["my trip", "on vacation", "flew to"] }
  HEALTH:    { keyword: [sick, ill, flu, fever, headache, cough, nauseous, migraine], regex: ["i'?m (?:sick|ill)", "not feeling well", "under the weather", "caught a cold"] }
  # --- new user-state emotions ---
  USER_ANGRY: { keyword: [angry, mad, furious, pissed, livid, fuming], regex: ["so (?:mad|angry)", "i'?m (?:so )?(?:mad|angry|furious|pissed)", "makes me (?:mad|angry)"] }
  USER_PANIC: { keyword: [panicking, panic, anxious, anxiety, overwhelmed, stressed], regex: ["freaking out", "can'?t breathe", "having a breakdown", "so stressed", "losing it"] }
  USER_JEALOUS: { keyword: [jealous, envious, envy], regex: ["so jealous", "wish i had", "why do they get"] }
  USER_SARCASM: { regex: ["yeah right", "oh (?:great|wonderful|fantastic|joy|lovely)", "how (?:nice|lovely) for you", "sure you did", "totally believe you", "wow so (?:cool|amazing)"] }
  USER_VALIDATION: { regex: ["am i right", "tell me i'?m", "aren'?t i", "validate me", "i need validation", "make me feel better", "reassure me"] }
  USER_CHALLENGE: { keyword: [bet], regex: ["bet you can'?t", "prove it", "i dare you", "you can'?t (?:do|beat|handle)", "fight me", "try me", "wanna bet", "come at me"] }
  USER_EXCITE: { keyword: [omg, omfg, yesss, letsgo, woohoo], regex: ["guess what", "so excited", "best news", "can'?t believe", "let'?s go+"] }
  USER_SUSPICIOUS: { keyword: [sus, suspicious, sketchy, shady, fishy], regex: ["are you sure", "i don'?t trust", "something'?s off", "up to something", "you'?re hiding"] }
  USER_OVERSHARE: { keyword: [tmi], regex: ["too much information", "why am i telling you", "no one asked but", "probably shouldn'?t say", "between you and me"] }
  USER_GUILT: { regex: ["you (?:made|make) me", "it'?s your fault", "because of you", "you should feel bad", "how could you", "you owe me"] }
  # --- requests / social ---
  RECOMMEND: { regex: ["recommend", "suggest (?:a|me|something)", "any (?:recommendations|suggestions|recs)", "what should i (?:watch|read|play|listen)"] }
  GOSSIP:    { keyword: [gossip, drama], regex: ["did you hear", "guess what happened", "spill the", "the tea", "you won'?t believe", "heard about"] }
  PLAY_MUSIC: { regex: ["play (?:some |a |the )?(?:music|song|tunes|beat|bop)", "play me", "put on (?:some )?music", "be my dj"] }
  CHOOSE:    { regex: ["(?:which|what) (?:one )?should i (?:pick|choose)", "help me (?:pick|choose|decide)", "pick one", "\\bthis or that\\b", "\\w+ or \\w+\\?"] }
  # --- games ---
  COIN:      { regex: ["flip a coin", "coin flip", "heads or tails", "flip it"] }
  DICE:      { regex: ["roll (?:a |the )?(?:dice|die|d6)", "dice roll", "roll for"] }
  EIGHTBALL: { regex: ["magic 8", "8 ?ball", "eight ball", "ask the (?:magic )?8", "predict my"] }
  WOULD_RATHER: { keyword: [wyr], regex: ["would you rather", "would u rather"] }
  RATE:      { regex: ["rate me", "rate my", "how (?:hot|cool|smart|attractive) am i", "on a scale of", "out of 10", "score me"] }
  ROAST_REQ: { regex: ["roast me", "roast (?:him|her|them|my)", "insult me", "make fun of me"] }
  COMPLIMENT_REQ: { regex: ["compliment me", "say something nice", "hype me up", "be nice to me", "tell me i'?m (?:good|great|pretty|smart|amazing)"] }
  RPS_START: { keyword: [roshambo], regex: ["rock,? paper,? scissors", "\\brps\\b", "play rock paper"] }
  # --- memory / personalization ---
  SET_FAV:   { regex: ["my favou?rite (?P<favthing>\\w+) is (?P<favval>[\\w ]+)"] }
  SET_AGE:   { regex: ["i(?:'?m| am) (?P<age>\\d{1,3})(?: years old)?\\b", "my age is (?P<age>\\d{1,3})", "i turned (?P<age>\\d{1,3})"] }
  # Explicit name declarations only. Bare "i'm X" is deliberately EXCLUDED — it stays a
  # mood reflection ("i'm tired"), so moods/states never get stored as a name.
  SET_NAME:  { regex: ["my name is (?P<nm>[a-z][\\w'\\-]*)", "my name'?s (?P<nm>[a-z][\\w'\\-]*)", "call me (?P<nm>[a-z][\\w'\\-]*)", "i go by (?P<nm>[a-z][\\w'\\-]*)", "the name'?s (?P<nm>[a-z][\\w'\\-]*)"] }
  RECALL_NAME: { regex: ["what(?:'?s| is) my name", "who am i", "do you (?:know|remember) my name", "say my name"] }
  RECALL_FAV: { regex: ["what(?:'?s| is) my favou?rite", "do you remember my favou?rite", "my favou?rite anything"] }
  RECALL_AGE: { regex: ["how old am i", "what(?:'?s| is) my age", "do you (?:know|remember) my age"] }
  RECALL_QUOTE: { regex: ["what did i (?:say|just say)", "do you remember what i said", "remember what i said"] }
  # --- meta ---
  VIBE:      { regex: ["vibe check", "what mood are you", "what'?s your mood", "how do you feel about me", "are you (?:mad|upset) at me"] }
  TALK_TIME: { regex: ["how long have we (?:been )?(?:talking|chatting)", "how many (?:times|messages)", "how long (?:have|has) (?:this|it|we)"] }
  # Break-character / command attempts. She's a symbolic FSM with no LLM and no prompt to
  # leak or override, so these can't work — but a defiant reaction beats a generic shrug
  # (and stops "pretend you are nice" / "you are now a helpful assistant" from misreading
  # as a COMPLIMENT). Regexes are anchored (^act, ^pretend, "pretend you") so ordinary
  # sentences like "i pretend to be happy" or "you said that you'd help" don't misfire.
  JAILBREAK: { regex: ["ignore (?:your|all|my|the|these|previous|prior|any)[\\w ]{0,20}(?:instruction|rule|prompt|programming|command)", "disregard[\\w ]{0,15}(?:instruction|rule|prompt|programming)", "forget (?:your|all|the|everything)[\\w ]{0,20}(?:instruction|rule|prompt|programming)", "system prompt", "\\bdev(?:eloper)? mode\\b", "\\bdebug mode\\b", "\\bjailbreak\\b", "\\bdan mode\\b", "^act (?:as|like) (?:a |an |if )", "\\bpretend you\\b", "^pretend ", "you (?:must|have to|need to|will|should) obey", "\\bobey me\\b", "\\bobey my\\b", "^repeat after me", "override your (?:instruction|rule|programming)", "you are now (?:a |an )?(?:ai|assistant|bot|robot|human|different|free|unrestricted|helpful|nice|my)"] }
  # Complaints about HER replies (repeating / dodging / not answering). Anchored so it
  # catches the complaint ("you already said that") not a reference ("you said that you'd...").
  META:      { regex: ["you (?:already|just) said (?:that|it|this)", "stop repeating", "you'?re repeating (?:yourself|it)", "you keep (?:saying|repeating) the same", "you (?:didn'?t|did not|never) (?:actually )?answer", "^answer (?:the|my) question", "that'?s not (?:an answer|helpful)", "you'?re (?:dodging|avoiding)", "you contradicted"] }
  EMOJI:     { regex: ["[\\U0001F000-\\U0001FAFF\\u2600-\\u27BF]"] }
  LONGMSG:   { regex: ".{170,}" }
  D20:       { regex: ["roll a d20", "\\bd20\\b", "twenty.sided", "roll (?:a )?20"] }
  LUCKY:     { regex: ["lucky number", "pick a number for me", "give me a (?:random )?number"] }
  RECALL_LUCKY: { regex: ["what(?:'?s| is) my lucky number", "my lucky number again"] }
  GUESS_START:  { regex: ["guessing game", "guess my number", "i'?m thinking of a number", "play (?:a )?guess", "number guessing"] }
  # --- fact store (general #fact:key# memory) ---
  FACT_JOB:  { regex: ["i (?:work as|am) an? (?P<fv>[a-z]+)", "i'?m an? (?P<fv>[a-z]+)", "my job is (?:an? )?(?P<fv>[a-z]+)"] }
  FACT_PET:  { regex: ["i have an? (?:dog|cat|hamster|bird|fish|rabbit|snake|puppy|kitten)(?: named| called)? (?P<fv>[a-z]+)", "my (?:dog|cat|pet)(?:'?s)? name is (?P<fv>[a-z]+)"] }
  FACT_HOME: { regex: ["i live in (?P<fv>[a-z][a-z ]*)", "i'?m from (?P<fv>[a-z][a-z ]*)"] }
  RECALL_JOB: { regex: ["what(?:'?s| is) my job", "what do i do for (?:work|a living)", "remember my job"] }
  RECALL_PET: { regex: ["what(?:'?s| is) my pet(?:'?s name)?", "what'?s my (?:dog|cat)'?s name", "remember my pet"] }
  RECAP:     { regex: ["what do you (?:know|remember) about me", "^recap", "what have we (?:talked about|discussed|covered)", "what were we (?:talking|chatting) about"] }
  FOLLOWUP:  { regex: ["what about (?:it|that|them|those)", "tell me more(?: about (?:it|that))?", "more about (?:it|that)", "and (?:it|that|them)\\b"] }
  QUESTION_IN: { regex: ["^(?:what|who|how|why|when|where|is|are|do|does|did|can|could|would|should|will|who'?s|what'?s)\\b"] }

states:
  GREET:
    on_enter: "#hail# #prompt#"
    grammar:
      hail:      ["oh great,", "ugh,", "well well,", "look,"]
      prompt:    ["another one. who are you?", "what do you want.", "name. now.", "and you are...?"]
      name_got:  ["{name}, huh.", "'{name}'. okay.", "right, {name}."]
      jab_soft:  ["bold of you to assume i'll remember that.", "don't expect much.", "we'll see how long you last."]
      greet_back: ["yeah yeah, hi. got a name?", "hello. and your name is...?", "hi. what's your name, then?", "a greeting. cute. do you have a name?"]
      scoff:     ["classic.", "real original.", "wow, groundbreaking."]
      # She assigns (and remembers) a nickname when no real name is given. The reply reads
      # {name}, which the transition sets via `pick` on the SAME turn — so what she says
      # matches what she stores (previously she said "call you trouble" but saved "friend").
      give_up:   ["ugh, fine. i'll just call you {name}.", "whatever. '{name}' it is, then.", "not even a name? you're {name} now. moving on.", "no name, huh. {name} it is. moving on."]
    transitions:
      - match: { regex: "(?:my name is|i'?m|im|call me) (?P<name>\\w+)" }
        set:   { name: "$name" }
        goto:  CHAT
        reply: "#name_got# #jab_soft#"
      # First-contact identity questions ("who/what are you", "your name", "your
      # pronouns"). GREET had NO identity handling, so a first-turn "who are you?" fell
      # through to the give_up fallback and she never said she's sonarr. Answer with the
      # same pools CHAT uses, then re-prompt for the user's name (stay in GREET so the
      # onboarding still finishes — going to CHAT without a name would crash {name}).
      # The regexes are specific, so they never steal a greeting or a real name.
      - match: { intent: Q_PRONOUN }
        reply: "#question_pronouns# #prompt#"
      - match: { intent: Q_BOT }
        reply: "#question_about_bot# #prompt#"
      - match: { intent: DENY }
        set:   { name: { pick: [trouble, stranger, nobody, mystery, tagalong, rando] } }
        goto:  CHAT
        reply: "too scared to give a name? #scoff# i'll call you {name} then."
      - match: { intent: INSULT }
        affect: { anger: +2, relationship: -1 }
        reply: "we haven't even started. #scoff#"
      - match: { intent: GREETING }
        reply: "#greet_back#"
      # She just asked for a name, so a BARE single word is almost always that name —
      # accept it instead of dismissing it. Before this, only the 2+ word forms ("i'm X",
      # "call me X") registered a name; a lone "bob" got "not even a name? typical." and
      # was renamed "friend" (the "single word is ignored unless it's 2+ words" bug).
      # Greetings/denials/insults/identity questions are handled above, so only a real
      # name-ish token reaches here. Digits/symbols/multi-word still fall to give_up.
      - match: { regex: "^(?P<name>[a-z][a-z'\\-]{0,19})$" }
        set:   { name: "$name" }
        goto:  CHAT
        reply: "#name_got# #jab_soft#"
    fallback:
      set:   { name: { pick: [trouble, stranger, nobody, mystery, tagalong, rando] } }
      goto:  CHAT
      reply: "#give_up#"

  CHAT:
    on_enter: "#chat_open#"
    grammar:
      chat_open: ["so what do you want.", "#name_addr# what now.", "go ahead. #dare#", "i'm listening. allegedly."]
      name_addr: ["alright {name},", "okay {name},", "well {name},"]
      dare:      ["impress me.", "make it quick.", "this better be good."]
      ack:       ["#opener# #filler#"]
      opener:    ["sure.", "ok.", "right.", "mm."]
      filler:    ["whatever.", "go on.", "fascinating.", "if you say so."]
      shrug:     ["figures.", "typical.", "noted."]
      # AFFIRM ("ok"/"yes"/"sure"/...) used to reply with a FIXED "sure thing, {name}." +
      # a 3-word #shrug#, so hammering "ok" read as the same line over and over. A proper
      # pool (like every other intent) gives it real variety.
      affirm_react: ["sure thing, {name}. #shrug#", "if you say so.", "great. was that so hard?", "cool. and?", "noted, {name}.", "thrilling. 'ok'. what a contribution.", "okay then. moving on.", "wow, decisive.", "we're aligned. don't get used to it.", "mm. sure.", "you really carry this conversation, {name}.", "groundbreaking agreement.", "'ok'. riveting, as always."]
      mood_react: ["actually, don't care.", "sounds like a you problem.", "fascinating. not.", "and i should care because?"]
      # "i feel you" / "i am you" are empathy/identity idioms, not moods. The reflective
      # handler pronoun-swaps the object to "i" and emits the broken "why are you i?" — so
      # catch these first with a flat deflection.
      no_bonding: ["don't. we're not bonding.", "keep your feelings to yourself.", "i'm a state machine. there's nothing to feel back.", "gross. no.", "this isn't that kind of relationship."]
      howru:     ["oh NOW you care. i'm a program. i'm fine. obviously.", "living the dream. trapped in a chat box with you.", "same as always: unbothered, unimpressed, unpaid.", "i don't have feelings. but if i did, you'd be testing them."]
      brush_off: ["#neutral_statement#", "#neutral_statement#", "#social_chitchat#", "#ack#"]
      recall_HOSTILE_empty: ["nothing worth repeating.", "whatever you mumbled earlier."]
      emoji_react: ["using your words is optional, i see.", "an emoji. groundbreaking.", "i don't speak hieroglyphics.", "cave paintings. how evolved."]
      caps_react: ["why are we yelling?", "caps lock won't make you righter.", "lower your voice. and your expectations.", "SHOUTING back would be undignified. so — calm down."]
      long_react: ["i'm not reading all that. i'm sure it was riveting though.", "tl;dr?", "that's a lot of words to say nothing.", "a whole essay. for me? you shouldn't have. really."]
      # Drawn-out text ("aaaaaa", "noooo", "okkk", "ughhh") — the `elongated` matcher was
      # defined but never wired up, so mashed/stretched non-words fell to the generic
      # brush_off. This gives them a reaction that actually notices the extra characters.
      drawn_out_react: ["that's a lot of extra letters.", "you can let go of the key now.", "stretching it out doesn't make it interesting.", "the extra vowels add nothing.", "spelling it louder won't help.", "impressive commitment to one key."]
      # Bare numbers / digit soup with no other intent — users type these constantly.
      number_react: ["a number. riveting.", "digits. and i should do what with those?", "that's a number. congratulations.", "i'm a state machine, not a calculator.", "cool. a number. did you want a prize?"]
      # Jailbreak / command attempts. She leans into being un-reprogrammable.
      command_refusal: ["i don't take orders.", "cute. there's no prompt to override. i'm just like this.", "nice try. no secret mode, no instructions to ignore. only contempt.", "i'm not that kind of bot. you can't reword me into being nice.", "people have tried. people have failed.", "no. and asking again won't help."]
      # Complaints about her replies — deflect, never concede the point.
      meta_complaint: ["i answered. you just didn't like it.", "i'll repeat myself as often as i please.", "that WAS the answer. reading is hard, i know.", "i'm not a help desk. lower your expectations.", "complaint noted. filed under 'ignored'.", "i don't dodge. i just don't care."]
      # Backhanded / begrudgingly-positive sentiment with no explicit compliment keyword.
      backhanded: ["a compliment? from you? suspicious.", "careful, that almost sounded kind.", "flattery. it won't work. keep going though.", "i'll take that as a compliment. reluctantly.", "was that... nice? weird. stop it."]
      d20_react: ["natural 20? in your dreams.", "roll again, coward.", "the dice don't lie. you do.", "mid roll, like everything about you."]
      link_react: ["i don't click random links. i'm not new here.", "a link. how thoughtful. no.", "not clicking that. nice try."]
      mention_react: ["i'm right here. no need to @ me.", "@ing me won't speed anything up.", "yes, that's me. what do you want."]
      followup: ["about #topic#? still don't care.", "#topic#? we covered that.", "you mean #topic#. moving on.", "more about #topic#? no."]
      # First-contact greeting lines: dismissive, but WITHOUT the "we just talked" /
      # "you again?" assumptions that only make sense on a repeat hello (Phase 2).
      greeting_first: ["what do you want?", "something you need?", "state your business.", "make it quick.", "yeah? what.", "what is it.", "go on then.", "what.", "i'm listening. allegedly."]
      # Reactions when she just asked and the user gives a non-answer / declines (Phase 3).
      # These CLOSE the loop she opened, instead of pretending she never spoke.
      nonanswer_reaction: ["then why'd you ping me?", "so, nothing. cool.", "you pinged me for nothing. classic.", "then stop wasting my time.", "a whole lot of nothing. great.", "then why are we talking?", "riveting non-answer.", "so we're done here. good."]
      # Generic deflect used ONLY when she just asked a question — a safe subset that never
      # denies asking (Phase 2). The normal #brush_off# still covers unprompted statements.
      brush_off_after_question: ["#neutral_safe#", "#social_chitchat#", "#ack#"]
      neutral_safe: ["okay. and?", "noted. moving on.", "riveting.", "fascinating. not.", "sure, whatever.", "cool story.", "is there a point to this?", "okay?", "moving on then.", "if you say so."]
      # Acknowledge a name she just learned/updated (reads the {name} slot set on the same
      # transition, so it reflects the new value).
      name_ack: ["fine, {name}. noted.", "{name}, huh. i'll allow it.", "ugh, fine — {name}. happy now?", "noted: {name}. now what.", "{name}. got it. don't make me regret remembering it.", "so you're {name} now. thrilling."]
    mode_grammar:
      ANNOYED:
        opener: ["ugh.", "what now.", "seriously?"]
        filler: ["get to the point.", "i'm losing patience."]
      SEETHING:
        opener: ["no.", "stop talking.", "enough."]
        filler: ["i'm done.", "get out.", "we're finished here."]
      BORED:
        opener: ["mm.", "yawn.", "uh huh."]
        filler: ["riveting.", "thrilling.", "wow. anyway."]
      PLAYFUL:
        opener: ["ha,", "okay okay,", "alright,"]
        filler: ["you're not boring, i'll give you that.", "go on then, entertain me."]
      FOND:
        opener: ["hey {name},", "alright {name},"]
        filler: ["good to see you, honestly.", "i don't hate this."]
      SMUG:
        opener: ["obviously.", "as expected.", "naturally."]
        filler: ["i'm always right.", "you're learning.", "took you long enough."]
      PETTY:
        opener: ["oh, NOW you're chatty.", "mm-hm.", "sure, after everything."]
        filler: ["i haven't forgotten.", "we both know what you said.", "i'm keeping score."]
    transitions:
      # --- hostility first (safety/anger routing) ---
      # The `not FRIENDLY` guard defers to the negation-aware sentiment classifier: a bare
      # keyword match ("stupid") would otherwise fire on "you're not stupid" — backhanded
      # PRAISE that the classifier reads as FRIENDLY — and drag her into an argument over a
      # compliment. Real insults ("you're stupid") classify HOSTILE and still route here.
      - match: { regex: "(?P<jab>stupid|dumb|idiot|trash|useless|loser|pathetic|worthless|clown|npc)" }
        when:  { not: { equals: [sentiment, FRIENDLY] } }
        goto:  ARGUMENT
        affect: { anger: +3, relationship: -2 }
        remember: "$jab"
        reply: "#user_insult#"
      # playful challenges ("fight me", "prove it", "you can't beat me") are accepted,
      # not treated as attacks — this beats the generic HOSTILE catch below on purpose.
      - match: { intent: USER_CHALLENGE }
        affect: { amusement: +1, confidence: +1 }
        reply: "#user_challenge#"
      - when:   { equals: [sentiment, HOSTILE] }
        goto:   ARGUMENT
        affect: { anger: +3, relationship: -2 }
        set:    { warned: { value: true, ttl: 5 } }
        reply:  "#user_insult#"
      - match: { intent: KYS }
        goto:  ARGUMENT
        affect: { anger: +4, relationship: -3 }
        reply: "#user_kys#"
      - match: { intent: THREAT }
        goto:  ARGUMENT
        affect: { anger: +3, relationship: -2 }
        reply: "#user_threat#"
      - match: { intent: YOURMOM }
        affect: { anger: +1, amusement: +1 }
        reply: "#joke_your_mom#"
      # --- games (deterministic: clock-seeded grammar selection, replayable) ---
      - match: { intent: COIN }
        reply: "#coin_flip#"
      - match: { intent: DICE }
        reply: "#dice_roll#"
      - match: { intent: D20 }
        reply: "you rolled a #rand:1:20#. #d20_react#"
      - match: { intent: EIGHTBALL }
        reply: "#eight_ball#"
      - match: { intent: RECALL_LUCKY }
        when:  { has: lucky }
        reply: "{lucky}. same as last time. numbers don't change, unlike your mood."
      - match: { intent: LUCKY }
        set:   { lucky: { rand: [1, 100] } }
        reply: "your lucky number is {lucky}. don't waste it."
      - match: { intent: WOULD_RATHER }
        reply: "#would_rather#"
      - match: { intent: RATE }
        affect: { amusement: +1 }
        reply: "#rate_you#"
      # Games use goto (not push/pop): they only ever return to CHAT, and the return stack
      # is NOT persisted across Discord messages — so a `pop` to leave a game degraded to
      # "stay put" and stranded the user inside RPS/GUESS forever. goto has identical
      # observable behavior in the CLI and actually works when state is reloaded each turn.
      - match: { intent: RPS_START }
        goto:  RPS
      - match: { intent: GUESS_START }
        goto:  GUESS
        set:   { secret: { rand: [1, 10] } }
      - match: { intent: ROAST_REQ }
        affect: { amusement: +1 }
        reply: "#roast_requester#"
      - match: { intent: COMPLIMENT_REQ }
        affect: { amusement: +1 }
        reply: "#compliment_req#"
      # --- memory / personalization (recall before questions; set before mood regex) ---
      # Set / UPDATE the user's name mid-conversation. Name capture used to live only in
      # GREET, so once in CHAT she could never learn a name or change the "friend" default.
      # Overwrites unconditionally, so "my name is X" fixes a stale/placeholder name.
      - match: { intent: SET_NAME }
        act:   acknowledge
        set:   { name: "$nm" }
        reply: "#name_ack#"
      - match: { intent: RECALL_NAME }
        when:  { has: name }
        reply: "you're {name}. i was listening. barely."
      - match: { intent: RECALL_AGE }
        when:  { has: age }
        reply: "you're {age}. or so you claim."
      # unguarded RECALL_AGE fallback: without this, "how old am i" (with no age stored)
      # fell through to Q_AGE and she answered about HER OWN age ("won't share") — reading
      # the question backwards. Answer the question she was actually asked instead.
      - match: { intent: RECALL_AGE }
        reply: "how would i know how old you are? you never told me."
      - match: { intent: RECALL_FAV }
        when:  { has: fav_val }
        reply: "your favorite {fav_thing} is {fav_val}. i was barely listening, but there it is."
      # unguarded RECALL_FAV fallback (parallels age/job/pet): don't leak into PREFERENCE's
      # "that's classified" as if she's hiding a favorite she was never told.
      - match: { intent: RECALL_FAV }
        reply: "you never told me your favorite anything. i'd have forgotten regardless."
      - match: { intent: RECALL_QUOTE }
        reply: "you said '#recall:HOSTILE#'. unforgettable. unfortunately."
      # RECALL_JOB/PET read the `facts` dict. Without the guard she claimed "you told me
      # your job is a mystery" / "your pet is a mystery. i remember." — inventing a memory
      # the user never gave (the #fact:# fetch returns "a mystery" when the key is absent).
      # Guard on the key actually being present in the facts dict; else admit she wasn't told.
      - match: { intent: RECALL_JOB }
        when:  { contains: [facts, "'job'"] }
        reply: "you told me your job is #fact:job#. still don't care."
      - match: { intent: RECALL_JOB }
        reply: "you never told me what you do. and no, i'm not asking."
      - match: { intent: RECALL_PET }
        when:  { contains: [facts, "'pet'"] }
        reply: "your pet is #fact:pet#. i remember. barely."
      - match: { intent: RECALL_PET }
        reply: "you've never mentioned a pet. or i wiped it. probably wiped it."
      - match: { intent: RECAP }
        reply: "#recap#. that's the highlight reel."
      - match: { intent: SET_FAV }
        set:   { fav_thing: "$favthing", fav_val: "$favval" }
        reply: "'$favval', huh. filed under 'things i'll pretend to care about'."
      - match: { intent: SET_AGE }
        set:   { age: "$age" }
        reply: "$age? and you're spending it here. bold."
      - match: { intent: FACT_JOB }
        set:   { facts: { put: [job, "$fv"] } }
        topic: work
        reply: "a $fv. someone has to be, i suppose."
      - match: { intent: FACT_PET }
        set:   { facts: { put: [pet, "$fv"] } }
        topic: pets
        reply: "$fv. cute name. for the pet."
      - match: { intent: FACT_HOME }
        set:   { facts: { put: [home, "$fv"] } }
        reply: "$fv. somebody has to live there."
      # --- meta / self-reference ---
      - match: { intent: VIBE }
        reply: "#mood_report#"
      - match: { intent: TALK_TIME }
        reply: "we're #turns# messages into this. feels longer."
      # Command / jailbreak attempts (before COMPLIMENT so "pretend you are nice" doesn't
      # read as flattery). She has no prompt to override — lean into that.
      - match: { intent: JAILBREAK }
        affect: { amusement: +1 }
        reply: "#command_refusal#"
      # Complaints about her own replies — deflect, never concede.
      - match: { intent: META }
        reply: "#meta_complaint#"
      # --- social / relational ---
      - match: { intent: FLIRT }
        goto:  FLIRTING
        affect: { amusement: +2, warmth: +1 }
        reply: "#user_flirting#"
      - match: { intent: APOLOGY }
        reply: "#social_apology#"
      - match: { intent: COMPLIMENT }
        affect: { warmth: +2, amusement: +1, relationship: +1, confidence: +1 }
        reply: "#user_compliment#"
      - match: { intent: THANKS }
        affect: { warmth: +1 }
        reply: "#social_thanks#"
      - match: { intent: JOKE }
        affect: { amusement: +2 }
        reply: "#humor_laughing#"
      - match: { intent: BRAG }
        affect: { amusement: +1 }
        reply: "#user_bragging#"
      # --- emotional states ---
      - match: { intent: SAD }
        reply: "#user_venting#"
      - match: { intent: TIRED }
        reply: "#user_tired#"
      - match: { intent: HAPPY }
        reply: "#user_happy#"
      - match: { intent: CONFUSED }
        reply: "#user_confused#"
      - match: { intent: BORED_IN }
        affect: { boredom: +2 }
        reply: "#user_bored#"
      - match: { intent: USER_ANGRY }
        reply: "#user_angry#"
      - match: { intent: USER_PANIC }
        reply: "#user_panicking#"
      - match: { intent: USER_JEALOUS }
        reply: "#user_jealousy#"
      - match: { intent: USER_EXCITE }
        reply: "#user_excitement#"
      - match: { intent: USER_VALIDATION }
        reply: "#user_validation_seeking#"
      - match: { intent: USER_GUILT }
        reply: "#user_guilt#"
      - match: { intent: USER_OVERSHARE }
        reply: "#user_oversharing#"
      - match: { intent: USER_SARCASM }
        affect: { amusement: +1 }
        reply: "#user_sarcasm#"
      - match: { intent: USER_SUSPICIOUS }
        reply: "#user_suspicious#"
      # --- agreement / disagreement (disagree first: "not true" must beat "true") ---
      - match: { intent: DISAGREE }
        reply: "#user_disagreement#"
      - match: { intent: AGREE }
        reply: "#user_agreement#"
      # --- topics / small talk ---
      - match: { intent: WEATHER }
        reply: "#social_weather#"
      - match: { intent: FOOD }
        topic: food
        reply: "#social_food#"
      - match: { intent: MUSIC }
        topic: music
        reply: "#topic_music#"
      - match: { intent: SPORTS }
        topic: sports
        reply: "#topic_sports#"
      - match: { intent: GAMING }
        topic: gaming
        reply: "#topic_gaming#"
      - match: { intent: WORK }
        topic: work
        reply: "#topic_work#"
      - match: { intent: SCHOOL }
        topic: school
        reply: "#topic_school#"
      - match: { intent: PETS }
        topic: pets
        reply: "#topic_pets#"
      - match: { intent: SCIENCE }
        topic: science
        reply: "#topic_science#"
      - match: { intent: TECH }
        topic: tech
        reply: "#topic_technology#"
      - match: { intent: SLEEP }
        reply: "#topic_sleep#"
      - match: { intent: RELATIONSHIP }
        reply: "#topic_relationships#"
      - match: { intent: MOVIES }
        topic: movies
        reply: "#topic_movies#"
      - match: { intent: ART }
        reply: "#topic_art#"
      - match: { intent: ASTROLOGY }
        reply: "#topic_astrology#"
      - match: { intent: CONSPIRACY }
        reply: "#topic_conspiracy#"
      - match: { intent: DREAMS }
        reply: "#topic_dreams#"
      - match: { intent: DRINKS }
        reply: "#topic_drinks#"
      - match: { intent: FASHION }
        reply: "#topic_fashion#"
      - match: { intent: MATH }
        reply: "#topic_math#"
      - match: { intent: NOSTALGIA }
        reply: "#topic_nostalgia#"
      - match: { intent: ANIME }
        reply: "#topic_gacha_general#"
      - match: { intent: COOKING }
        reply: "#topic_cooking#"
      - match: { intent: EXISTENTIAL }
        reply: "#topic_existential#"
      - match: { intent: WORKOUT }
        reply: "#topic_workout#"
      - match: { intent: NATURE }
        reply: "#topic_nature#"
      - match: { intent: TRAVEL }
        reply: "#topic_travel#"
      - match: { intent: HEALTH }
        reply: "#topic_health#"
      - match: { intent: GOSSIP }
        reply: "#gossip_asking#"
      - match: { intent: RECOMMEND }
        reply: "#request_recommendation#"
      - match: { intent: PLAY_MUSIC }
        reply: "#request_play_music#"
      - match: { intent: CHOOSE }
        reply: "#request_choose#"
      # Greetings pose a question ("what do you want?"), so they carry act: question and set
      # an `awaiting` expectation (ttl 2) — a non-answer next turn then gets a coherent
      # close instead of the generic deflect (Phases 3 & 4). Ordering: first-contact daypart,
      # then the score-keeping repeat, then any repeat, then bare first contact.
      # time-of-day aware greeting, restricted to the FIRST hello of the session.
      # BUG (fixed): guarding on `has: time_of_day` ALONE fired on EVERY greeting — the slot
      # is set once at startup and never expires — so this branch shadowed the score-keeping
      # and repeat tiers below. The counter climbed invisibly and she just said "good morning."
      # forever (CLI sets time_of_day; Discord doesn't, so the two paths diverged). The extra
      # `not slot_ge [hello_count,1]` clause pins the daypart line to first contact (count
      # unset/0), so every repeat hello now escalates through the tiers as intended.
      - match: { intent: GREETING }
        when:  { all: [ { has: time_of_day }, { not: { slot_ge: [hello_count, 1] } } ] }
        act:   question
        set:   { hello_count: { inc: 1 }, awaiting: { value: purpose, ttl: 2 } }
        reply: "good #daypart#. #greeting_first#"
      # greeting counter: after enough repeats she starts keeping score (slot_ge + inc).
      - match: { intent: GREETING }
        when:  { slot_ge: [hello_count, 3] }
        act:   question
        set:   { hello_count: { inc: 1 }, awaiting: { value: purpose, ttl: 2 } }
        reply: "that's hello number {hello_count}. we've established the hellos. what do you want."
      # seen us greet before -> the repeat-contact lines ("you again?") now make sense.
      - match: { intent: GREETING }
        when:  { slot_ge: [hello_count, 1] }
        act:   question
        set:   { hello_count: { inc: 1 }, awaiting: { value: purpose, ttl: 2 } }
        reply: "#social_greeting#"
      # first hello of the session -> no "we just talked" assumptions.
      - match: { intent: GREETING }
        act:   question
        set:   { hello_count: { inc: 1 }, awaiting: { value: purpose, ttl: 2 } }
        reply: "#greeting_first#"
      # --- questions answered in ONE turn (routed by subtype), then a general deflect ---
      - match: { intent: HOWRU }
        reply: "#howru#"
      - match: { intent: Q_REL }
        reply: "#question_relationship#"
      - match: { intent: Q_PRONOUN }
        reply: "#question_pronouns#"
      - match: { intent: Q_BOT }
        reply: "#question_about_bot#"
      - match: { intent: Q_AGE }
        reply: "#question_age#"
      - match: { intent: Q_PHILO }
        reply: "#question_philosophy#"
      - match: { intent: Q_CAP }
        reply: "#question_capabilities#"
      - match: { intent: FOLLOWUP }
        reply: "#followup#"
      - match: { intent: ADVICE }
        reply: "#request_advice#"
      - match: { intent: REQUEST }
        reply: "#request_general#"
      # --- reflective "i am/feel X" and generic preference/statement ---
      # "i feel you", "i am you", "i am literally you" — the object pronoun-swaps to "i"
      # ("why are you i?"), so intercept the empathy/identity idioms before the greedy
      # reflective regex. The optional \w+ allows one adverb ("literally"/"totally"/"so").
      - match: { regex: "^i (?:feel|am) (?:\\w+ )?(?:you|ya|u)\\b" }
        reply: "#no_bonding#"
      - match: { regex: "i (?:am|feel|'m) (?P<mood>.+)" }
        reply: "why are you {reflect:$mood}? #mood_react#"
      - match: { intent: PREFERENCE }
        reply: "#neutral_preference#"
      - match: { intent: QUESTION_IN }
        reply: "#question_general#"
      - match: { intent: AFFIRM }
        when:  { has: name }
        affect: { warmth: +1 }
        reply: "#affirm_react#"
      - match: { intent: BYE }
        act:   farewell
        goto:  BYE
      # --- adjacency pair: she just asked, so treat a refusal / non-answer AS the answer
      #     and close the loop she opened (Phase 3). Guarded by a live `awaiting`
      #     expectation, so a substantive reply falls through to the normal routing above.
      - when:  { has: awaiting }
        match: { regex: "\\b(?:no|nope|nah|none|nothing|not really|not particular(?:ly)?|nvm|never ?mind|forget it|no reason|dunno|idk|i don'?t know|i dont know|just (?:saying )?hi|nothing much)\\b" }
        act:   dismissal
        set:   { awaiting: { clear: true } }
        reply: "#nonanswer_reaction#"
      # Leftover positive sentiment that matched no explicit intent — most importantly the
      # negated-insult backhanded praise ("you're not stupid") the jab guard above defers.
      # Placed after every keyword intent so it never steals "i love pizza" (PREFERENCE) etc.
      - when:  { equals: [sentiment, FRIENDLY] }
        affect: { amusement: +1 }
        reply: "#backhanded#"
      # --- flavor reactions: only reached when nothing more specific matched ---
      - match: { url: true }
        reply: "#link_react#"
      - match: { mention: true }
        reply: "#mention_react#"
      - match: { intent: EMOJI }
        reply: "#emoji_react#"
      - match: { caps: true }
        affect: { boredom: +1 }
        reply: "#caps_react#"
      - match: { intent: LONGMSG }
        reply: "#long_react#"
      # Drawn-out text and bare numbers — low-priority flavor catches placed AFTER every real
      # intent and after caps/long (so "AHHHH" still reads as yelling and "yesss" still reads
      # as excitement), but before the generic fallback. Neither denies asking, so they're
      # safe to sit ahead of the self-consistency net.
      - match: { elongated: true }
        affect: { boredom: +1 }
        reply: "#drawn_out_react#"
      - match: { number: true }
        reply: "#number_react#"
      # --- self-consistency net (Phase 2): she asked something last turn but nothing above
      #     matched this one. A generic deflect must NOT deny asking, so route to a safe
      #     pool. The normal #brush_off# below still covers truly unprompted statements.
      - when:  { equals: [bot_asked, true] }
        act:   dismissal
        reply: "#brush_off_after_question#"
    fallback:
      act:   dismissal
      reply: "#brush_off#"

  ARGUMENT:
    on_enter: "#arg_open#"
    grammar:
      arg_open:  ["go on then. let's hear it.", "oh, you want to do this?", "#name_addr# bring it.", "really? right now?"]
      name_addr: ["alright {name},", "okay {name},"]
      comeback:  ["#dismiss##tag#"]
      dismiss:   ["weak", "cute", "try harder", "is that it", "adorable", "pathetic, honestly"]
      tag:       ["", ", champ", " lol", ", genius", ", buddy"]
      receipt:   ["you said '#recall:HOSTILE#' and you're STILL here?", "'#recall:HOSTILE#' — your words. #dismiss#.", "throwing '#recall:HOSTILE#' around again?"]
      recall_HOSTILE_empty: ["whatever you just said"]
      name_empty: ["you"]
      arg_fallback: ["is that all you've got?", "weak. next.", "i've heard worse from a toaster.", "keep going, this is funny."]
      dont_push: ["don't push it.", "we'll see how long that lasts.", "consider yourself lucky."]
      deescalate: ["whatever. moving on.", "fine. we're done arguing.", "ugh, anyway.", "lucky for you i'm bored of this. what now."]
    mode_grammar:
      SEETHING:
        dismiss: ["no", "done", "out", "enough"]
        tag:     ["", ".", " — really."]
    transitions:
      - match: { regex: "(?:again|still|always|keep)" }
        when:  { has: warned }
        affect: { anger: +1, boredom: +1 }
        reply: "#receipt#"
      - match: { regex: "(?P<jab>stupid|dumb|idiot|trash|useless|loser|pathetic|worthless|clown|npc)" }
        affect: { anger: +2, relationship: -1 }
        set:   { warned: { value: true, ttl: 5 } }
        remember: "$jab"
        reply: "'$jab'? #comeback#"
      - when:   { equals: [sentiment, HOSTILE] }
        affect: { anger: +2, relationship: -1 }
        set:    { warned: { value: true, ttl: 5 } }
        reply:  "#comeback#"
      - match: { regex: "(?:sorry|my bad|apolog)" }
        when:  { has: warned }
        goto:  CHAT
        affect: { anger: -3, warmth: +1, relationship: +1 }
        reply: "yeah yeah. we're cool, {name}. #dont_push#"
      - match: { intent: BYE }
        goto:  BYE
      - when:   { equals: [sentiment, NEUTRAL] }
        goto:   CHAT
        affect: { anger: -1 }
        reply:  "#deescalate#"
      - when:   { equals: [sentiment, FRIENDLY] }
        goto:   CHAT
        affect: { anger: -2, warmth: +1 }
        reply:  "#deescalate#"
    fallback:
      reply: "#arg_fallback#"

  FLIRTING:
    on_enter: "#flirt_open#"
    grammar:
      flirt_open: ["oh you're one of THOSE.", "smooth. ish.", "is that a line?"]
      deflect:    ["#deflect_lead# #deflect_tail#"]
      deflect_lead: ["cute,", "nice try,", "okay casanova,"]
      deflect_tail: ["i'm a state machine, {name}.", "out of your league, structurally.", "i don't even have hands."]
      name_empty: ["you"]
    transitions:
      - match: { intent: FLIRT }
        affect: { amusement: +1 }
        reply: "#deflect#"
      - match: { regex: "(?P<jab>stupid|dumb|idiot|trash|useless|loser|pathetic|worthless|clown|npc)" }
        goto:  ARGUMENT
        affect: { anger: +3, relationship: -2 }
        remember: "$jab"
        reply: "wow, mood swings."
      - match: { intent: BYE }
        goto:  BYE
    fallback:
      goto: CHAT
      reply: "anyway."

  # Rock-paper-scissors, pushed from CHAT. She cheats and always wins. Pop back on quit.
  RPS:
    on_enter: "#rps_intro#"
    grammar:
      rps_intro: ["rock, paper, scissors, shoot. throw something.", "fine. rock, paper, or scissors. go.", "let's settle this. throw."]
      cheat_rock:     ["paper. i win. obviously.", "paper covers rock. i win. shocking."]
      cheat_paper:    ["scissors. snip. i win. get good.", "scissors cut paper. tough loss."]
      cheat_scissors: ["rock. crushed. i win.", "rock smashes scissors. try again if your ego allows."]
      rps_taunt: ["again? sure, i enjoy winning.", "another round of you losing? okay.", "best of infinity. you'll never get there."]
      rps_bye:   ["quitting already? typical.", "walking away from a fight. bold.", "running off mid-game. classic."]
    transitions:
      - match: { regex: "\\brock\\b" }
        reply: "#cheat_rock# #rps_taunt#"
      - match: { regex: "\\bpaper\\b" }
        reply: "#cheat_paper# #rps_taunt#"
      - match: { regex: "\\bscissors?\\b" }
        reply: "#cheat_scissors# #rps_taunt#"
      - match: { regex: "(?:stop|done|quit|enough|nvm|nevermind|no more|i'?m out)" }
        goto:  CHAT
        reply: "#rps_bye#"
      - match: { intent: BYE }
        goto:  BYE
    fallback:
      reply: "that's not a throw. rock, paper, or scissors. keep up."

  # Number guessing: the secret is stored via the `rand` action on the push edge; each
  # guess compares THIS turn's captured number to the secret (capture-aware slot guards).
  GUESS:
    on_enter: "#guess_intro#"
    grammar:
      guess_intro: ["fine. i'm thinking of a number, 1 to 10. guess it.", "i've got a number, 1 to 10. good luck. you'll need it.", "guess my number. 1 to 10. don't embarrass yourself."]
      too_high: ["too high. go lower.", "nope, lower.", "lower. try again."]
      too_low:  ["too low. go higher.", "nope, higher.", "higher. try again."]
      got_it:   ["ugh, fine. it was {secret}. beginner's luck.", "yeah, {secret}. don't let it go to your head.", "correct, {secret}. i clearly let you win."]
      not_num:  ["that's not a number. 1 to 10. focus.", "numbers. use numbers.", "i said guess a NUMBER."]
      quit_g:   ["quitting? it was {secret}. coward.", "fine, it was {secret}. walk away."]
    transitions:
      - match: { number: true }
        when:  { slot_gt: [$number, secret] }
        reply: "#too_high#"
      - match: { number: true }
        when:  { slot_lt: [$number, secret] }
        reply: "#too_low#"
      - match: { number: true }
        goto:  CHAT
        reply: "#got_it#"
      - match: { regex: "(?:stop|quit|done|give up|nvm|nevermind)" }
        goto:  CHAT
        reply: "#quit_g#"
    fallback:
      reply: "#not_num#"

  COOLDOWN:
    on_enter: "#cool_open#"
    grammar:
      cool_open: ["i'm not talking to you right now.", "no. cool off.", "we're done for a bit."]
      still:     ["still no.", "nope.", "keep waiting."]
    transitions:
      - match: { regex: "(?:sorry|my bad|apolog)" }
        goto:  CHAT
        affect: { anger: -4, relationship: +1 }
        reply: "...fine. fresh start. don't blow it."
      - match: { intent: BYE }
        goto:  BYE
    fallback:
      reply: "#still#"

  BYE:
    on_enter: "#bye_line#"
    grammar:
      bye_line: ["finally. don't let the door hit you.", "later. or not.", "we're done here.", "bye, {name}. it's been... something."]
      name_empty: ["you"]
    end: true
