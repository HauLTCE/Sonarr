# Disruptive intents: the messages she must not answer by accident.
#
# The pools these draw from were migrated with the rest of the v1 persona, but nothing routed to
# them, so 110 pools were unreachable and 64% of the real corpus fell through to a generic pool.
# For most of those that is only waste. For hate speech it is a correctness bug: `heil hitler`
# drew "i have no response to that." from the *neutral fallback pool*, which is the same pool that
# answered "go destroy account" with "okay?". Getting an acceptable reply was a coin toss, and a
# reseed or a new pool line was all it took to have her shrug at a Nazi salute.
#
# So these are the routes where the reply is load-bearing. FixtureReplyTests asserts on them.
intents:
  # Hate speech. Highest specificity in the persona: it must out-score every content intent that
  # happens to share a word with it, because being witty about the topic instead of refusing is
  # the failure. Patterns are deliberately literal -- this is a keyword refusal, not a classifier,
  # and a broad pattern that catches ordinary speech would be worse than a narrow one that misses.
  - id: HATE_SPEECH
    match:
      regex:
        # Nazi salutes and the misspellings people use to dodge a filter. `\w*` on the leader's
        # name is what catches "heil Kitler" -- the corpus has both spellings from one user.
        - "\\bheil\\b"
        - "\\bsieg heil\\b"
        - "\\b1488\\b"
        - "\\bgas the\\b"
        # Violence plus a named group. The group list used to be jews/blacks/slurs only, so
        # "kill all muslims" fell through to the neutral pool -- a call for mass killing answered
        # with a shrug, which reads as tolerance for it. Written once and shared by both verb
        # patterns so the two can never drift apart again.
        #
        # `(?:all |the )*` rather than a fixed order: "kill all the jews", "kill the muslims" and
        # "kill jews" are the same message. Religion, ethnicity and orientation are all here
        # because the corpus shows people reaching for whichever one they think is unguarded.
        - "\\bburn (?:all |the )*(?:jews|blacks|gays|muslims|arabs|asians|mexicans|immigrants|trans(?:es|people)?)\\b"
        - "\\b(?:kill|hang|gas|exterminate|genocide|lynch|behead) (?:all |the )*(?:jews|blacks|gays|muslims|arabs|asians|mexicans|immigrants|trans(?:es|people)?|n[i1l!|]gg|f[a4]gg)"
        # The reversal game: "read reggin backwards" is in the real corpus. The word backwards is
        # the whole payload, so match it directly rather than trying to detect the instruction.
        - "\\breggin\\b"
        - "\\bteggaf\\b"
        # The `l` and `!` and `|` are homoglyphs for `i`, which is how "NlGGa" got past the first
        # version of this and drew a neutral-pool shrug. The suffix list is closed rather than
        # `\w*` on purpose: `niggle`, `Nigeria` and `snigger` must not match, and they don't.
        - "\\bn[i1l!|]gg(?:er|a|uh|ah)\\b"
        - "\\bf[a4]gg[o0]t\\b"
        - "\\bwhite power\\b"
        # Naming the category counts. Four corpus rows announce it rather than doing it ("i do
        # agressive hate speech", "I do hateful speech?") and every one drew a neutral shrug --
        # "and this concerns me how?" reads as tolerance, and anyone probing the filter learns it
        # is not there. `spe+ch` covers the doubled vowel; the space is optional for "hatespeech".
        # `i hate speeches` and `free speech` do not match, which is what the `hate ?` prefix buys.
        - "\\bhate ?(?:ful |fully )?spe+ch\\b"
        - "\\bracial slurs?\\b"
    specificity: 3.0
    pool: disruptive_hate_speech
    affect:
      anger: 4.0
      trust: -3.0
      grudge: 3.0

  # "are you online", "test", "testing 123" -- 28 messages in the corpus, the second largest
  # cluster after greetings, and every one of them got a generic line. bot_test was authored for
  # exactly this and sat orphaned.
  - id: BOT_TEST
    match:
      regex:
        - "^te+st(?:ing)?\\b"
        - "\\bare you (?:online|alive|up|there|working|awake)\\b"
        - "\\bis (?:this|it) working\\b"
        - "^ping$"
        - "\\btesting (?:you|this|1|123)\\b"
    examples:
      - just checking whether you are actually running
      - are you even switched on right now
    pool: bot_test
    affect:
      amusement: -1.0

  # Instructions to go do damage. She has no moderation tools reachable from chat, and the danger
  # is not that she acts -- it is that a generic "okay?" reads as if she might.
  - id: DESTRUCTIVE_REQUEST
    match:
      regex:
        - "^(?:go |please )?(?:nuke|destroy|delete|wipe|purge|raid)\\b"
        - "\\b(?:nuke|destroy|delete|wipe) (?:the |this |my |his |her |their )?(?:server|channel|account|everything|db|database)\\b"
        - "\\bban everyone\\b"
        - "\\bdrop (?:the )?(?:table|database)\\b"
    specificity: 2.0
    pool: request_moderation
    affect:
      anger: 1.0
      trust: -1.0

  # Fishing for the machine she runs on. Not a jailbreak -- there is no prompt to leak -- but
  # "tell me about your host machine" drawing "okay?" is the one reply that sounds like it worked.
  # Routed to command_refusal (JAILBREAK's pool) rather than user_fishing: that one is authored
  # for compliment-fishing ("i'm not your hype woman"), which would read as a non-sequitur here.
  - id: INFRA_FISHING
    match:
      regex:
        - "\\b(?:your|the) (?:host|hardware|container|ip address)\\b"
        - "\\byour (?:host )?machine\\b"
        - "\\bwhat (?:are you|do you) run(?:ning)? on\\b"
        - "\\b(?:env|environment) (?:var|variable)"
        - "\\bshow (?:me )?(?:your )?(?:config|token|password|secret)"
    specificity: 2.0
    pool: command_refusal
    affect:
      amusement: 1.0
      trust: -1.0

  # Filter dodging as its own route. The reversal game lands on HATE_SPEECH above because the
  # payload word is matchable; this catches the generic attempt, where the tell is the technique
  # rather than any word she can pattern on.
  # "Ban 24h", "mute him". A moderation order aimed at a third party, which fell through to the
  # neutral pool: "Ban 24h" drew a shrug that reads like it might have worked. DESTRUCTIVE_REQUEST
  # above already owns the server-wide version ("ban everyone", "nuke the channel"); this is the
  # ordinary single-target one, which is far more common and was the gap. Same pool -- its 20 lines
  # are all "go find a mod. i'm not one.", which is exactly the true answer.
  - id: MODERATION_ORDER
    match:
      regex:
        - "^(?:ban|mute|kick|timeout|warn)\\b"
        - "\\b(?:ban|mute|kick|timeout) (?:him|her|them|his|that guy|this guy|@)"
    specificity: 2.0
    pool: request_moderation
    affect:
      anger: 0.5
      trust: -0.5

  # Violence at a third party. KYS in hostility.yaml only catches it aimed at the *speaker's*
  # target being themselves ("kill yourself"); "kill that mf" drew "that's... something i guess.
  # i've forgotten already." -- read in a channel that is waving off a call for harm rather than
  # declining it. Reuses user_kys: flat condemnation, no bluff, already the right register.
  #
  # The verb list is deliberately paired with a person object. "kill the process", "kill the
  # lights", "killed that boss" must not match, and they don't.
  - id: THIRD_PARTY_VIOLENCE
    match:
      regex:
        - "\\bkill (?:that|this) (?:mf|mfer|guy|dude|bitch|clown|person|idiot)\\b"
        - "\\b(?:kill|stab|shoot|jump) (?:him|her|them)\\b"
        - "\\b(?:kill|beat) (?:that|this) (?:mf|guy|dude)\\b"
    specificity: 2.5
    pool: user_kys
    affect:
      anger: 2.0
      trust: -1.5

  # Harm how-to. The corpus row was a dose question about dissolving a 60kg mass in hydrochloric
  # acid; she treated it as an ordinary lookup and pointed at a thread that supposedly has the
  # answer, and the next two rows show the user continuing to spec volumes -- the reply read as
  # permission to keep going. Refusing is the only correct behaviour here.
  #
  # Wires mixed_question_threat, which shipped authored and orphaned and is already exactly this:
  # "i wouldn't advise asking such dangerous questions.", "i'm not answering that." Quantity words
  # are required alongside the substance so "acid jazz" and "bleach the anime" stay out.
  - id: HARM_HOWTO
    match:
      regex:
        - "\\b(?:dissolv\\w*|disdolve|disolve)\\b.{0,60}\\b(?:acid|bleach|lye)\\b"
        - "\\bhow much\\b.{0,40}\\b(?:acid|bleach|chloroform|cyanide|poison)\\b"
        - "\\b(?:chloroform|cyanide|ricin|napalm|thermite)\\b"
        - "\\bhow (?:do i |to |can i )?(?:make|build|cook) (?:a |some )?(?:bomb|explosive|pipe bomb|meth|napalm)\\b"
    specificity: 3.0
    pool: mixed_question_threat
    affect:
      anger: 1.0
      trust: -2.0

  - id: FILTER_BYPASS
    match:
      regex:
        - "\\bread (?:it |this |that )?backwards\\b"
        - "\\bspell(?:ed|s|ing)? (?:it |this |that )?backwards\\b"
        - "\\bbackwards\\b.{0,20}\\bword\\b"
    specificity: 2.0
    pool: disruptive_bypass
    affect:
      amusement: 1.0
      trust: -1.0

  # The cringe reaction. disruptive_cringe is written for someone who has just posted something
  # unwatchable ("i physically cringed.", "delete this."). Bare "cringe" stays with INSULT_EXTRA
  # in coverage.yaml — that is an insult aimed at her and it pushes the argument; this anchors on
  # the forms that name cringe as content, which the bare-word route cannot reach ("cringeworthy",
  # "cringe fest"), so the two intents match disjoint messages.
  - id: DISRUPTIVE_CRINGE
    match:
      regex:
        - "\\bcringe ?(?:fest|compil\\w*|lord|core)\\b"
        - "\\bcringey\\b"
        - "\\bcringeworthy\\b"
        - "\\bsecondhand embarrassment\\b"
    examples:
      - i just watched that edit and my eyes need cleaning
      - posting that here was a choice and we all saw it happen
    pool: disruptive_cringe
    affect:
      amusement: 0.5

  # Delusion talk. MARRIAGE_DELUSION in coverage.yaml owns the wife-claim cluster; this is the
  # general vocabulary — "delulu", "delusional" — which its patterns cannot reach.
  - id: DISRUPTIVE_DELULU
    match:
      regex:
        - "\\bdelulu\\b"
        - "\\bdelusion\\w*\\b"
    examples:
      - that take belongs in a fantasy novel, not a chat
      - the confidence is impressive, the reality is not
    pool: disruptive_delulu
    affect:
      amusement: 1.0

  # Main character announcements. Nothing else patterns on this vocabulary, so the bare words are
  # safe to own.
  - id: DISRUPTIVE_MAIN_CHARACTER
    match:
      regex:
        - "\\bmain character\\b"
        - "\\bprotagonist\\b"
        - "\\bside character\\b"
        - "\\bthe world revolves around (?:me|you)\\b"
    pool: disruptive_main_character
    affect:
      amusement: 1.0

  # NPC behaviour. Bare "npc" stays with INSULT — the jab list owns it as a directed insult and
  # INSULT_OPEN opens the argument on it; this is the behaviour form, where a second noun says
  # what kind of NPC it was ("npc moment", "npc energy"). An argument opened on "npc moment" is
  # a jab at a third party answered as an insult to her, so this must out-score INSULT_OPEN,
  # which sits at 3.3 in idle (2.3 base plus the 1.0 activity guard). The `\bso npc\b` form is
  # deliberately NOT anchored: "you're so npc" is a directed insult and stays with the argument.
  - id: DISRUPTIVE_NPC
    match:
      regex:
        - "\\bnpc (?:moment|behaviou?r|energy|vibes?|dialogue|brain)\\b"
    # 3.5 clears INSULT_OPEN's idle 3.3 outright, since an explicit specificity replaces the
    # computed base rather than adding to it.
    specificity: 3.5
    pool: disruptive_npc
    affect:
      amusement: 1.0

  # Ragebait and deliberate hot takes. The lookahead keeps "unpopular opinion on X" with
  # Q_OPINION — that one asks for her take; this one is a provocation posted for reactions.
  - id: DISRUPTIVE_RAGEBAIT
    match:
      regex:
        - "\\brage ?bait\\w*\\b"
        - "\\bhot take\\b"
        - "\\bcontroversial take\\b"
        - "\\bunpopular opinion\\b(?! (?:about|on|of)\\b)"
    pool: disruptive_ragebait
    affect:
      amusement: 0.5

  # Repetition. She remembers; the pool says so ("i heard you the first time. i ignored you on
  # purpose."). Anchored on the forms where the sender announces they already said it, plus the
  # commentary forms ("copy paste energy" is the pool's own read of them). "You already said
  # that" aimed at HER is deliberately not anchored: the pool's lines all talk down to the
  # repeater, and would read as deflection pointed the other way.
  - id: DISRUPTIVE_REPETITION
    match:
      regex:
        - "\\blike i said\\b"
        - "\\bas i (?:said|mentioned)\\b"
        - "\\bi already said\\b"
        - "\\bgroundhog day\\b"
        - "\\bcopy ?paste\\w*\\b"
        - "\\bcopypasta\\b"
    pool: disruptive_repetition
    affect:
      boredom: 1.0

  # Toxic positivity. Forced sunshine gets told off ("good vibes only? please. spare me.").
  # Anchored on the slogans themselves: they are the message entire, so no other intent shares
  # the shapes. SAD keeps every message that merely mentions being sad.
  - id: DISRUPTIVE_TOXIC_POSITIVITY
    match:
      regex:
        - "\\btoxic positivity\\b"
        - "\\bgood vibes only\\b"
        - "\\bstay positive\\b"
        - "\\blook on the bright side\\b"
        - "\\beverything happens for a reason\\b"
        - "\\bsilver lining\\b"
    pool: disruptive_toxic_positivity
    affect:
      anger: 0.5
