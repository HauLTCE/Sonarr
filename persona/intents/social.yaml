# social intents — migrated from the v1 persona, CHAT state (deleted tree; read it with
# `git show python-bot-final:_bot_legacy/elaine/persona/elaine.yaml`).
# Patterns carry over verbatim; Python (?P<x>) named groups rewritten to .NET (?<x>).
intents:
# Hand-authored: v1 split these across four state-conditional transitions each (hello_count,
# time_of_day, has-name). The v2 engine picks the pool; the count-aware variants become the
# adapter's problem, not the matcher's.
- id: GREETING
  match:
    keyword:
    - hi
    - hello
    - hey
    - yo
    - sup
    - hiya
    - heya
    - howdy
    - greetings
    regex:
    - what'?s up
    - whats up
    - good (?:morning|evening|afternoon)
    - \bh+i+\b
    - \bh+e+y+\b
    - \by+o+\b
    - \bs+u+p+\b
    - \bh+e+l+o+\b
    # "hai" -- a typed "hi", and in the corpus. `h+i+` cannot reach it (the vowel is wrong), so it
    # read as a vowel-poor nonsense token and drew "i have no idea what that means." from the
    # keysmash pool. The trailing `\b` is what keeps this off "haiku", "hair" and "hail": all three
    # continue with a letter where the pattern wants a boundary.
    - \bh+a+i+\b
    - \bh+i+y+a+\b
    - \bh+e+y+a+\b
    - \bh+o+w+d+y+\b
  examples:
  - look who decided to show up in my notifications
  - anyone around in here
  pool: social_greeting
  # "hey elaine why do you hate me" is two things: an opening and a question. The question scores
  # higher and became the whole reply, so the greeting was dropped in silence -- and that is a
  # large part of why a long message got a short answer. As a side effect it rides along after the
  # primary instead: one clause for the greeting, one for what was actually asked.
  #
  # Safe here because a greeting is never the *point* of a longer message. When it is the whole
  # message it is the only candidate, so it is the primary and this flag does nothing.
  side_effect: true
- id: BYE
  match:
    keyword:
    - bye
    - goodbye
    - cya
    - gtg
    - ttyl
    regex:
    - see ya
    - i'?m (?:leaving|off|out)
    - have to go
    - gotta go
    - good ?night
    # "peace" and "later" were bare keywords, and both are ordinary words before they are
    # farewells. "you peace of ship" (a spoonerized insult) drew a goodbye she was never given, and
    # "i'll do it later" would too. As farewells they only ever appear alone or with a particle, so
    # the anchored forms lose nothing: "peace out", "later!", "see you later".
    #
    # A regex here also outranks a keyword on specificity, which is the point -- the insult above
    # now reaches the insult route instead of tying with a farewell.
    - ^(?:peace|later)$
    - \bpeace out\b
    - (?:see|catch) (?:you|ya|u) later\b
  examples:
  - alright, i am logging off for the night
  - that is me done, catch you tomorrow
  pool: social_goodbye
- id: HOWRU
  match:
    regex:
    - how are you
    - how'?re you
    - how are u
    - how you doing
    - how'?s it going
    - hows it going
    - you (?:doing )?(?:ok|okay|good|alright)
    - how do you feel
  examples:
  - what kind of mood are you in today
  - everything alright on your end
  pool: howru
- id: AFFIRM
  match:
    # Anchored, because these were keywords and a keyword matches the token wherever it sits.
    # "fine. no caps. what inputs do you actually accept from this state?" opened with "fine."
    # and drew an agreement noise -- she nodded along to a direct question, which reads as a
    # malfunction rather than a snub. An agreement noise is only an agreement noise when it is
    # the entire message; the moment a sentence follows, the sentence is the message.
    #
    # The normalizer strips trailing ".!?,;:" from the whole message (Normalizer.cs:13), so
    # "yes." arrives as "yes" and needs no punctuation in the pattern. Interior periods survive,
    # which is exactly what makes the anchor work on the row above.
    regex:
    # "fr" and "amen" are the same noise typed differently and drew "that's... something i guess."
    # and "that's what you interrupted me for?" -- the second of which is a complaint about being
    # interrupted by agreement. Both belong in this list; both keep the anchor, and "fr" needs it
    # more than any word here, being two letters that start plenty of others.
    - ^(?:yes|yeah|yea|ye|sure|ok|okay|k|kk|yep|yup|fine|alright|aight|right|true|indeed|fr|frfr|amen|word|facts)$
    # Doubled or stretched, still just noise: "yes yes", "ok ok ok", "yeah sure".
    # Quoted because a plain YAML scalar cannot contain ": " and `(?: ` has one.
    - '^(?:yes|yeah|sure|ok|okay|yep|yup|fine|alright)(?: (?:yes|yeah|sure|ok|okay|yep|yup|fine|alright))+$'
  pool: affirm_react
  affect:
    fondness: 1.0
- id: FLIRT
  match:
    keyword:
    - marry
    - gorgeous
    - sexy
    regex:
    - i (?:like|love|luv) (?:you|u)\b
    - be my (?:gf|girlfriend|valentine|wife|bf|boyfriend)
    - you'?re (?:so |really |very |pretty )?(?:cute|hot|gorgeous|beautiful|sexy|attractive|adorable)
    - you are (?:so |really )?(?:cute|hot|gorgeous|beautiful|sexy|adorable)
    - date me
    - marry me
    - wanna (?:date|kiss)
    - you'?re my (?:type|crush|bae)
    # "U are the only one i need", "only u". Devotion rather than a compliment or a proposition, so
    # none of the patterns above reach it, and it drew "is there a point to this?" -- which reads as
    # her not having understood it. user_flirting is written for exactly this ("in your dreams.",
    # "i'm a bot, weirdo.").
    #
    # `only (?:you|u)$` is anchored to the whole message: unanchored it would take "i only you"
    # typos and, worse, "only you can fix this" -- a request, not a declaration.
    - (?:you|u) (?:are|r) (?:the )?only one i need\b
    - ^only (?:you|u)$
    - all i need is (?:you|u)\b
  pool: user_flirting
  affect:
    amusement: 2.0
    fondness: 1.0
- id: APOLOGY
  match:
    keyword:
    - sorry
    regex:
    - my bad
    - apolog
    - didn'?t mean
  examples:
  - that came out worse than i intended, i take it back
  - i was out of line earlier
  pool: social_apology
  # "my bad. what do you actually want to talk about?" drew "actions speak louder." and nothing
  # else -- the apology outscored the question and the question was dropped, so the one thing she
  # was actually asked went unanswered. An apology attached to a sentence is a preface to it.
  side_effect: true
- id: COMPLIMENT
  match:
    keyword:
    - smart
    - cool
    - nice
    - awesome
    - amazing
    - based
    - funny
    - clever
    - brilliant
    - goated
    - helpful
    - genius
    - legend
    - wholesome
    fuzzy:
    - wonderful
    max_distance: 2
    regex:
    - you'?re (?:the |so |really |pretty )?(?:best|great|goat|goated)
    - you (?:rock|rule|slay)
    - good bot
    - well done
    - nailed it
  examples:
  - honestly you are better at this than most people i know
  - okay that response was actually impressive
  pool: user_compliment
  affect:
    fondness: 2.0
    amusement: 1.0
    trust: 1.0
    confidence: 1.0
- id: THANKS
  match:
    keyword:
    - thanks
    - thx
    - ty
    - cheers
    regex:
    - thank (?:you|u|ya)
    - appreciate (?:it|you|ya|that|this)
  examples:
  - that actually helped a lot, i owe you one
  - you did not have to do that for me
  pool: social_thanks
  affect:
    fondness: 1.0
  # Same reason as GREETING: "thanks, but how do i undo it" is gratitude plus a question, and the
  # question is the part she was asked. Riding along keeps the thanks answered instead of eaten.
  side_effect: true
# joke_dad had 20 authored lines and nothing that could fire them, so the dad_jokes stance in
# stances.yaml was an opinion she could never be caught holding. Regexes only: a bare "pun"
# keyword would eat half the JOKE traffic below, and a regex outranks a keyword on specificity
# so declaration order does not matter here.
- id: DADJOKE
  match:
    regex:
    - dad ?joke
    - (?:that'?s|thats|what) a pun
    - knock knock
    - (?:hi|hello) (?:hungry|thirsty|tired),? i'?m dad
  examples:
  - i've got a pun for you
  - here comes a groaner
  pool: joke_dad
  affect:
    amusement: 1.0
    boredom: 0.5
- id: JOKE
  match:
    keyword:
    - lol
    - lmao
    - haha
    - joke
    - kidding
    - jk
    - lmfao
    - rofl
    - hilarious
    regex:
    - ha ?ha
  pool: humor_laughing
  affect:
    amusement: 2.0
- id: DISAGREE
  match:
    keyword:
    - wrong
    - incorrect
    - disagree
    regex:
    - i disagree
    - you'?re wrong
    - youre wrong
    - that'?s (?:wrong|not right|false|not true)
    - no way
    - (?:don'?t|dont) think so
    - not really
  examples:
  - i am not convinced by that at all
  - that is the opposite of what actually happened
  pool: user_disagreement
- id: AGREE
  match:
    keyword:
    - agreed
    - exactly
    - facts
    regex:
    - i agree
    - you'?re right
    - youre right
    - that'?s true
    - so true
    - good point
    - fair enough
    - makes sense
    - well said
    - sounds good
    - sounds right
  examples:
  - yeah that lines up with what i was thinking
  - hard to argue with any of that
  pool: user_agreement
- id: GOSSIP
  match:
    keyword:
    - gossip
    - drama
    regex:
    - did you hear
    - guess what happened
    - spill the
    - the tea
    - you won'?t believe
    - heard about
  pool: gossip_asking
