# topics intents — migrated from the v1 persona, CHAT state (deleted tree; read it with
# `git show python-bot-final:_bot_legacy/elaine/persona/elaine.yaml`).
# Patterns carry over verbatim; Python (?P<x>) named groups rewritten to .NET (?<x>).
intents:
- id: VIBE
  match:
    regex:
    - vibe check
    - what mood are you
    - what'?s your mood
    - how do you feel about me
    - are you (?:mad|upset) at me
  pool: mood_report
- id: WEATHER
  match:
    keyword:
