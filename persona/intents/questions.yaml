# questions intents — migrated from the v1 persona, CHAT state (deleted tree; read it with
# `git show python-bot-final:_bot_legacy/elaine/persona/elaine.yaml`).
# Patterns carry over verbatim; Python (?P<x>) named groups rewritten to .NET (?<x>).
intents:
- id: RECOMMEND
  match:
    regex:
    - recommend
    - suggest (?:a|me|something)
    - any (?:recommendations|suggestions|recs)
    - what should i (?:watch|read|play|listen)
  examples:
  - give me something good to put on tonight
  - i have run out of things to watch, help
  pool: request_recommendation
- id: PLAY_MUSIC
  match:
    regex:
    - play (?:some |a |the )?(?:music|song|tunes|beat|bop)
    - play me
    - put on (?:some )?music
    - be my dj
  examples:
  - get something going in the voice channel
  - queue up whatever you think fits the mood
  pool: request_play_music
- id: CHOOSE
  match:
    regex:
    - (?:which|what) (?:one )?should i (?:pick|choose)
    - help me (?:pick|choose|decide)
    - pick one
    - \bthis or that\b
    - \w+ or \w+\?
  pool: request_choose
- id: Q_REL
  match:
    regex:
    - do you (?:like|love|care about|hate|even like) me
    # Third-party phrasings too. "do you love someone" is a question only she can answer, and it
    # drew "i'm not your personal google assistant." from question_general.
    - do you (?:like|love|hate) (?:someone|anyone|anybody)
    # "u love someone ?" drew "i'm riveted. can't you tell?" -- the same question as the line above
    # with the auxiliary dropped and `you` typed as `u`, which is how half the corpus types it. The
    # auxiliary is optional and the pronoun takes both spellings; the trailing `?` was already gone
    # before matching (the normalizer strips it), so it needs nothing here.
    - (?:do )?u (?:like|love|hate) (?:someone|anyone|anybody)
    - do you care
    - are we (?:friends|dating|a thing|cool)
    - am i your
    - do you miss me
    - do you have feelings for
  examples:
  - where do i actually stand with you
  - am i just another user to you
  pool: question_relationship
- id: Q_PRONOUN
  match:
    keyword:
    - pronouns
    regex:
    # Singular too. "what's your pronoun" drew "let me google that for you" -- she told the user to
    # search the web for her own pronouns, while seven authored answers sat right here.
    - your pronouns?
    - what pronouns?
    - how do i refer to you
    # Article optional: "are you male" fell through to question_general and got "i'd explain it to
    # you, but i don't have any crayons.", two rows after she volunteered she/her unprompted.
    - are you (?:a )?(?:girl|woman|boy|man|guy|dude|she|he|female|male)
    - you a (?:girl|guy|dude|boy)\b
    - he or she
    - she or he
  pool: question_pronouns
# Above Q_BOT deliberately: "what are your opinions about someone?" matched Q_BOT on "what are
# your" and she introduced herself to a question about a third party -- one variant even voiced
# "who am i?", a question the user never asked. question_opinion shipped orphaned and is exactly
# this ("do i look like i have opinions about random people?").
- id: Q_OPINION
  match:
    regex:
    - opinions? (?:about|on|of)
    - what do you think (?:about|of)
    - your thoughts (?:about|on)
    - how do you feel about
  examples:
  - what's your read on that person
  - any views on him
  # An explicit specificity REPLACES the computed one rather than adding to it (LexicalMatcher.cs:85),
  # so this has to clear Q_BOT's own score outright. Q_BOT's "what are you" pins 12 literal chars
  # and lands at 3.2; 1.5 lost to it, which is how the first version of this route still let her
  # introduce herself.
  specificity: 3.5
  pool: question_opinion
- id: Q_BOT
  match:
    regex:
    - who are you
    - what are you
    - your name
    - are you (?:a )?(?:bot|ai|robot|human|real|person|machine)
    - what'?s your name
    - whats your name
    - who (?:made|created) you
  examples:
  - so what exactly am i talking to here
  - is there a person behind this or not
  pool: question_about_bot
- id: Q_AGE
  match:
    regex:
    - how old
    - your age
    - when were you born
  pool: question_age
- id: Q_PHILO
  match:
    regex:
    - meaning of life
    - why are we here
    - what is love
    - purpose of life
    - is there a god
    - what happens when we die
    - free will
  examples:
  - does any of this actually matter in the long run
  - do you think we choose anything or is it all decided
  pool: question_philosophy
# question_hypothetical had 19 authored lines and nothing that could fire them -- the same defect
# as joke_dad (see the note above DADJOKE in social.yaml). "if you have $1mil what would you do"
# drew "my advice? leave me alone." because ADVICE owned "what would you do", so she refused to
# give advice nobody had asked for, while "my imagination doesn't work for free." sat unreachable.
- id: Q_HYPO
  match:
    regex:
    # The conditional opener is what makes it hypothetical rather than a real ask. Requiring a
    # subject and a modal keeps ordinary conditionals out: "if you want, tell me" is not a question.
    - ^if (?:you|i|we|they) (?:have|had|has|were|was|are|could|can|would|get|got|win|won)\b
    - what if\b
    - (?:imagine|suppose|pretend) (?:if |that |you |i )
    # "would you ever ..." is the same shape without an if. Not bare "would you", which is REQUEST's
    # ("would you stop"), and not "would you rather", which WOULD_RATHER owns with its own pool.
    - would you ever\b
    # Moved off ADVICE, which still owns every phrasing about the reader's own situation ("what
    # should i do", "any advice", "help me decide"). The subject pronoun is the whole difference:
    # "what should i do" wants advice, "what would you do" asks her to imagine. Left on ADVICE it
    # also out-scored this intent on literal length, so the pin below would never have moved.
    - what would you do
  examples:
  - say you woke up tomorrow with a body, then what
  - in a world where none of this existed, what would change
  pool: question_hypothetical
- id: Q_CAP
  match:
    regex:
    - what can you do
    - what do you do
    - are you able to
    - your capabilities
    - what are you capable
    # A bare "help" drew "i didn't need to know that." -- someone asking for help was told they
    # overshared, and anyone who types that concludes she is broken rather than rude. It belongs
    # here rather than in a new intent: question_capabilities is already the list of what she can
    # be asked for, which is the answer to "help".
    #
    # Anchored, so "help me move a couch" still reaches REQUEST and "helped" does not match at all.
    - ^help$
    - ^(?:what|which) commands
    - how do i use you
  examples:
  - give me the list of things you are actually useful for
  - what is the point of having you in this server
  pool: question_capabilities
- id: ADVICE
  match:
    regex:
    - what should i do
    - 'should i '
    - any advice
    - help me decide
    # "what would you do" moved to Q_HYPO: it asks her to imagine, not the reader for direction.
    # The rest of this list is about the reader's own situation, which is what request_advice
    # answers.
    - give me advice
  examples:
  - i am stuck between two options and cannot commit to either
  - talk me through this, i keep going back and forth
  pool: request_advice
- id: REQUEST
  match:
    regex:
    - 'can you '
    - 'could you '
    - 'would you '
    # `\b` not a trailing space: "please" is most often the last word of a message ("stop please",
    # "play something please"), and with the space this pattern could only see it mid-sentence.
    # The word boundary is what the space was really for -- it still keeps "pleased" out.
    - please\b
    - i (?:need|want) you to
    - help me
    - do me a favor
    - 'give me '
    # Asking for a joke is a request, and JOKE's bare "joke" keyword was eating it: "tell me a
    # joke" drew "was that supposed to be a joke?" from humor_laughing -- she reviewed a joke
    # nobody had told. A regex outranks a keyword on specificity (see the note above DADJOKE in
    # social.yaml), so this wins without touching JOKE, and the referring uses it exists for
    # ("it was a joke", "can't take a joke") keep it.
    #
    # request_general rather than a new pool: it is the refusal pool, and refusing to perform on
    # demand is both in voice and true. Her having no joke to tell is the joke.
    - (?:tell|say|give|sing|show) (?:me |us )?(?:a|an|another|some|the) ?(?:joke|jokes|pun|puns)\b
    # Same defect, different word: "say something funny" hit COMPLIMENT's "funny" keyword, so she
    # thanked the reader for a compliment nobody paid.
    - (?:tell|say) (?:me |us )?something funny
  pool: request_general
- id: PREFERENCE
  match:
    regex:
    - 'i (?:like|love|enjoy|prefer|adore) '
    - my favorite
    - i'?m a fan of
    - 'i (?:hate|dislike|can''?t stand|cant stand) '
  pool: neutral_preference
- id: QUESTION_IN
  match:
    regex:
    # The wh- and copula openers. Nothing that starts with one of these is an imperative, so
    # a bare anchor is safe here.
    # `^` here means start-of-line, not start-of-message: the row that prompted the AFFIRM
    # anchoring fix was "fine. no caps. what inputs do you actually accept from this state?",
    # where the actual question is the third sentence. `(?:^|[.!?]\s+)` lets a question that
    # follows a completed sentence still be recognised as one. Mid-sentence is deliberately
    # excluded -- "i wonder what he wants" is a statement.
    - (?:^|[.!?]\s+)(?:what|who|why|when|where|which|whose|is|are|was|were|could|should|who'?s|what'?s)\b
    # `how` needed one word carved out. "how about i touch your balls" drew "did you even try
    # looking it up?" -- a proposition answered as a lookup request, because "how about" is a
    # proposal and not a question for information. Everything else beginning with "how" is a
    # real question ("how come", "how much", "how do i"), so a one-word exclusion beats a
    # whitelist of continuations that would have to be maintained.
    - ^how\b(?! about\b)
    # `do` is the one auxiliary that also opens an imperative. "do it" was classified as a
    # question and answered "i'm not your personal google assistant." Requiring a subject
    # pronoun after it splits the two cleanly: "do you", "do i", "do people" are questions,
    # "do it", "do that now", "do your job" are orders and fall through to the neutral pool,
    # which after the overshare cull answers any message shape.
    #
    # Not done with a question mark: the normalizer strips trailing ".!?,;:" from the whole
    # message (Normalizer.cs:13), so a `\?` lookahead is dead for the one position a question
    # mark actually occupies. That was the first version of this pattern, and it silently cost
    # "does it work?" its route.
    - ^do\s+(?:i|you|we|they|he|she|u|any\w*|some\w*|people|most)\b
    # does/did/will/would/can are unambiguous enough bare: "does it work", "did it happen",
    # "would it kill you" are all questions. `can` is the loosest of them, but "can you ..."
    # is already REQUEST's and outranks this catch-all.
    - ^(?:does|did|will|would|can)\b
  # 2.0 + 0.1 * 2, which is what the single alternation above used to compute from its
  # shortest guaranteed branch ("is"). Pinned so splitting it into three patterns does not
  # quietly raise the catch-all's score past the narrow intents it must never outrank.
  specificity: 2.2
  pool: question_general
