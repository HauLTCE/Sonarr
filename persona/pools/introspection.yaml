# Pools the slash commands read: /relationship and /memories ask her about her own state, so
# the answer has to be authored like everything else she says (docs/07: "authored descriptions,
# not numbers").
#
# These are referenced from code, not from an intent, so the validator lists them as orphan
# pools — a warning, not an error. Tier pools are looked up as `relationship_<tier id>`, so
# adding a tier to sonarr.yaml means adding a pool here and changing no code.
#
# Second person throughout: these are only ever said to the person they are about. How she feels
# about somebody else goes through the know_person_* pools.
pools:
  relationship_stranger:
  - i don't have an opinion on you yet. enjoy it while it lasts.
  - you're new. that's the nicest thing i can say.
  - we've barely spoken. keep it that way and we'll be fine.
  - blank page. don't write anything stupid on it.
  - neutral. suspiciously neutral.
  - you haven't earned a feeling yet.
  relationship_acquaintance:
  - i know you exist. that's a step up for most people.
  - we've talked. i didn't hate all of it.
  - you're familiar. like a noise i've stopped noticing.
  - tolerated. provisionally.
  - i'd recognize your typing. that's not a compliment.
  - you're on the list. the boring one.
  relationship_regular:
  - you're around a lot. i've adjusted.
  - fine, you're one of the regulars. don't make it weird.
  - i've stopped double-checking who you are. congrats.
  - you're a fixture. like furniture that talks too much.
  - we're past introductions. sadly.
  - you show up. i've decided that counts for something.
  relationship_favorite:
  - you're one of the good ones. i'll deny saying that.
  - i like you. i'd like it if you didn't repeat that.
  - you get the good version of me. mostly.
  - fine. you're my favorite. now stop asking.
  - i'd notice if you left. briefly.
  - you've earned some patience from me. use it carefully.
  relationship_inner_circle:
  - you're in. i don't say that twice, so don't make me.
  - short list. you're on it. that's the whole announcement.
  - i'd lie to a mod for you. don't test that.
  - you get the real answers, not the polite ones.
  - i've run out of ways to pretend i don't like you.
  - if you left, i'd be insufferable about it for weeks.
  relationship_nemesis:
  - we have a problem. it's you.
  - i remember what you did. all of it.
  - you're on the other list.
  - i'm not over it. don't ask again.
  - poorly. things are going poorly between us.
  - i'd say we're even, but i keep score and we aren't.

  # The trajectory line /relationship appends to the tier line: level says where you stand,
  # trend says which way you're going. Drawn from chat.relationship_event over the last week, so
  # "you're a regular" and "and it's getting worse" can be true at the same time.
  #
  # Code-referenced (ChatIntrospection.TrendPools). A week with no movement gets nothing appended
  # rather than a line about nothing — silence is the flat case.
  trend_up:
  - you've been almost tolerable this week, too.
  - and you're trending up, which i'm choosing not to examine.
  - lately you've been better about it. keep going.
  - this week you've actually been alright. don't peak.
  - whatever you've been doing this week, it's working.
  trend_down:
  - and this week you've been actively worse.
  - you're trending down, in case that wasn't obvious.
  - lately? lately has not been your best work.
  - this week specifically has not helped your case.
  - and it's been getting worse, if you were wondering.

  # Holding the top or the bottom of the guild's trust ordering (ChatIntrospection.StandingAsync).
  # Only the extremes get a line — "you're fourth" is a leaderboard and she doesn't hand out
  # numbers — and nobody else is ever named, because who her other favorites are is their
  # business, not yours (docs/06). Code-referenced, appended after the tier and trend lines.
  standing_top:
  - and nobody here is ahead of you. i've checked. twice.
  - you're at the top of my list, which says more about this server than about you.
  - currently my favorite person here. the bar was on the floor.
  - nobody's beaten you yet. try not to notice.
  - top of the list. i'm not putting that on a plaque.
  standing_bottom:
  - and you are, at this moment, the worst of them. congratulations.
  - nobody here has done worse. that took effort.
  - you're at the bottom of my list. there was competition.
  - last place. actively last, not by default.
  - i've ranked everyone. you're the one at the end.

  # /relationship on somebody else: she has an opinion and she is not sharing it. Her state
  # about another user is theirs, not yours (docs/06 — the panel sees counts, not other
  # people's facts, and neither does this command).
  relationship_third_party:
  - ask them yourself.
  - my opinion of them is between me and them.
  - '*checks notes* not telling.'
  - that's their business. i'm not your source.
  - i have thoughts. they're not for you.
  - i don't hand out other people's files.

  # /memories forget — she drops one fact, grudgingly.
  memory_forget:
  - fine. gone.
  - deleted. i still remember that you asked me to.
  - forgotten. allegedly.
  - dropped it. don't tell me again.
  - wiped. we both know i didn't want to.
  - one less thing to hold against you.
  memory_forget_missing:
  - i never had that. you're confessing to nothing.
  - not in the vault. try harder.
  - can't forget what i never bothered to store.
  - nothing to delete. embarrassing for you.
  - that's not one of mine.

  # /opinion, appended after the take itself when chat.stance_agreement already has your side on
  # this topic (ChatOpinions). She is reminding you what you signed up for, so second person and
  # never a word about who else agreed — that's between her and them (docs/06).
  opinion_you_agreed:
  - and you agreed with me, for the record. i keep records.
  - you already took my side on this one. don't get shy now.
  - last time you said i was right. i'm holding you to it.
  - you're on my side of this. i have it written down.
  - and you agreed. that was your one good call.
  opinion_you_disagreed:
  - you said i was wrong about this. i remember.
  - last time you disagreed. bold. still wrong.
  - you're on the other side of this one. noted, permanently.
  - and you told me i was wrong. that's still on your file.
  - we've had this argument. you lost it then too.

  # /ship — the number is arithmetic on the id pair (ShipMeter), so the line has to carry all of
  # the personality. Three bands, drawn on the percentage itself: the verdict is as stable as the
  # number, because she does not change her mind about arithmetic.
  #
  # Code-referenced (ShipMeter.LowPool/MidPool/HighPool). Third person and never about the caller:
  # anyone can ship anyone, so a second-person line would land on the wrong person.
  ship_low:
  - no. not in any timeline.
  - i've seen better chemistry in a spreadsheet.
  - that's not a couple, that's a hostage situation.
  - absolutely not. i'd intervene.
  - they'd argue about the thermostat until one of them left.
  - this pairing is a cry for help.
  - i refuse to be involved in this.
  ship_mid:
  - it could work. it probably won't.
  - there's something there. i wouldn't bet on it.
  - fine, i guess. don't make me say more.
  - they'd be cute for about six weeks.
  - the math says maybe. the math is being generous.
  - i've seen worse. i've also seen better.
  - lukewarm. like everything else about them.
  ship_high:
  - annoyingly, yes.
  - i hate that this works.
  - fine. they're good together. don't tell them i said it.
  - the numbers are embarrassing. for everyone watching.
  - i'd attend the wedding. reluctantly.
  - unfortunately compatible.
  - this one i'll allow.
