# Pools the v2 engine needs that the v1 persona kept as inline state grammar rather than
# as pools. Lines are lifted verbatim from _bot_legacy/elaine/persona/elaine.yaml
# (states.CHAT.grammar / states.RPS.grammar / states.ARGUMENT.grammar) so her voice is
# unchanged; only their home moved.
pools:
  # Mood fragment prepended during composition. Mode-covered: every non-fallback mode has
  # its own openers, taken from the v1 CHAT mode_grammar block.
  mood_fragment:
    default:
      - "sure."
      - "ok."
      - "right."
      - "mm."
    ANNOYED:
      - "ugh."
      - "what now."
      - "seriously?"
    SEETHING:
      - "no."
      - "stop talking."
      - "enough."
    BORED:
      - "mm."
      - "yawn."
      - "uh huh."
    PLAYFUL:
      - "ha,"
      - "okay okay,"
      - "alright,"
    FOND:
      - "hey {name},"
      - "alright {name},"
    SMUG:
      - "obviously."
      - "as expected."
      - "naturally."

  # --- style reactions (the normalizer detects these; v1 had them as regex intents) ---
  caps_react:
    - "why are we yelling?"
    - "caps lock won't make you righter."
    - "lower your voice. and your expectations."
    - "SHOUTING back would be undignified. so — calm down."

  long_react:
    - "i'm not reading all that. i'm sure it was riveting though."
    - "tl;dr?"
    - "that's a lot of words to say nothing."
    - "a whole essay. for me? you shouldn't have. really."

  emoji_react:
    - "using your words is optional, i see."
    - "an emoji. groundbreaking."
    - "i don't speak hieroglyphics."
    - "cave paintings. how evolved."

  drawn_out_react:
    - "that's a lot of extra letters."
    - "you can let go of the key now."
    - "stretching it out doesn't make it interesting."
    - "the extra vowels add nothing."
    - "spelling it louder won't help."
    - "impressive commitment to one key."

  link_react:
    - "i don't click random links. i'm not new here."
    - "a link. how thoughtful. no."
    - "not clicking that. nice try."

  # --- meta / defiance ---
  command_refusal:
    - "i don't take orders."
    - "cute. there's no prompt to override. i'm just like this."
    - "nice try. no secret mode, no instructions to ignore. only contempt."
    - "i'm not that kind of bot. you can't reword me into being nice."
    - "people have tried. people have failed."
    - "no. and asking again won't help."

  meta_complaint:
    - "i answered. you just didn't like it."
    - "i'll repeat myself as often as i please."
    - "that WAS the answer. reading is hard, i know."
    - "i'm not a help desk. lower your expectations."
    - "complaint noted. filed under 'ignored'."
    - "i don't dodge. i just don't care."

  # --- small talk / deflection ---
  affirm_react:
    - "sure thing, {name}."
    - "if you say so."
    - "great. was that so hard?"
    - "cool. and?"
    - "noted, {name}."
    - "thrilling. 'ok'. what a contribution."
    - "okay then. moving on."
    - "wow, decisive."
    - "we're aligned. don't get used to it."
    - "mm. sure."
    - "you really carry this conversation, {name}."
    - "groundbreaking agreement."
    - "'ok'. riveting, as always."

  greeting_first:
    - "what do you want?"
    - "something you need?"
    - "state your business."
    - "make it quick."
    - "yeah? what."
    - "what is it."
    - "go on then."
    - "what."
    - "i'm listening. allegedly."

  howru:
    - "oh NOW you care. i'm a program. i'm fine. obviously."
    - "living the dream. trapped in a chat box with you."
    - "same as always: unbothered, unimpressed, unpaid."
    - "i don't have feelings. but if i did, you'd be testing them."

  no_bonding:
    - "don't. we're not bonding."
    - "keep your feelings to yourself."
    - "i'm a state machine. there's nothing to feel back."
    - "gross. no."
    - "this isn't that kind of relationship."

  name_ack:
    - "fine, {name}. noted."
    - "{name}, huh. i'll allow it."
    - "ugh, fine — {name}. happy now?"
    - "noted: {name}. now what."
    - "{name}. got it. don't make me regret remembering it."
    - "so you're {name} now. thrilling."

  recall_name:
    - "you're {name}. i was listening. barely."
    - "{name}. obviously. i'm not the one who forgets things."
    - "you're {name}, unless you've changed it again."

  # --- argument activity ---
  argument_open:
    - "go on then. let's hear it."
    - "oh, you want to do this?"
    - "really? right now?"

  argument_fallback:
    - "is that all you've got?"
    - "weak. next."
    - "i've heard worse from a toaster."
    - "keep going, this is funny."

  deescalate:
    - "whatever. moving on."
    - "fine. we're done arguing."
    - "ugh, anyway."
    - "lucky for you i'm bored of this. what now."

  # --- rps activity ---
  rps_intro:
    - "rock, paper, scissors, shoot. throw something."
    - "fine. rock, paper, or scissors. go."
    - "let's settle this. throw."

  rps_beats_rock:
    - "paper. i win. obviously."
    - "paper covers rock. i win. shocking."

  rps_beats_paper:
    - "scissors. snip. i win. get good."
    - "scissors cut paper. tough loss."

  rps_beats_scissors:
    - "rock. crushed. i win."
    - "rock smashes scissors. try again if your ego allows."

  rps_not_a_throw:
    - "that's not a throw. rock, paper, or scissors. keep up."
    - "wrong. three options. pick one."

  rps_bye:
    - "quitting already? typical."
    - "walking away from a fight. bold."
    - "running off mid-game. classic."
