# hostility intents — migrated from the v1 persona, CHAT state (deleted tree; read it with
# `git show python-bot-final:_bot_legacy/elaine/persona/elaine.yaml`).
# Patterns carry over verbatim; Python (?P<x>) named groups rewritten to .NET (?<x>).
intents:
# Hand-authored twin of INSULT, for the opening shot. user_insult answers an insult in the
# middle of things; argument_open is the "oh, we're doing this?" line that starts a fight.
# Same patterns as INSULT, so the two tie on specificity and the guard decides: while the
# activity is idle the bonus puts this one first, and its `push: argument` moves the
# conversation into the argument activity — where this guard fails, the intent leaves the
# ranking, and every follow-up insult lands on INSULT. One-way in, and DEESCALATE is still
# the way out.
- id: INSULT_OPEN
  match:
    regex:
    - (?<jab>stupid|dumb|idiot|trash|useless|loser|clown|npc)
    fuzzy:
    - pathetic
    - worthless
    max_distance: 2
  guards:
  - kind: activity
    value: idle
    bonus: 1.0
  pool: argument_open
  push: argument
  affect:
    anger: 3.0
    trust: -1.0
    grudge: 1.0
# Hand-authored: v1 routed insults through a `when: not FRIENDLY` sentiment guard, which the
# migration could not carry (no sentiment classifier in v2 yet). The capture and the argument
# push are v1's; the backhanded-compliment case ("you're not stupid") is now COMPLIMENT's
# problem to out-score, not a guard's.
- id: INSULT
  match:
    regex:
    - (?<jab>stupid|dumb|idiot|trash|useless|loser|clown|npc)
    fuzzy:
    - pathetic
    - worthless
    max_distance: 2
  pool: user_insult
  push: argument
  affect:
    anger: 3.0
    trust: -1.0
    grudge: 1.0
# Hand-authored: the only way back out of an argument. Without it the push above is a
# one-way door — every later turn draws from the argument fallback (`argument_fallback`) and she
# stays hostile forever, which is the terminal-state trap v1 shipped in BYE. Activity-guarded
# so a plain "sorry" in normal chat is still APOLOGY.
- id: DEESCALATE
  match:
    regex:
    - sorry
    - my bad
    - truce
    - i was joking
    - jk
    - calm down
    - let'?s (?:drop|stop) (?:it|this)
    - (?:can we |let'?s )?move on
  guards:
  - kind: activity
    value: argument
    bonus: 1.0
  pool: deescalate
  pop: true
  affect:
    anger: -2.0
    trust: 0.5
- id: USER_CHALLENGE
  match:
    # Every line in user_challenge squares up to the reader ("bring it.", "prepare to be
    # humiliated.", "challenge declined."), so the challenge has to be aimed at her. A bare "bet"
    # keyword and a bare "prove it" were not: "I know bro cheated but I can't prove it" drew
    # "bring it." -- she took a confession of helplessness about a third party as a threat against
    # herself, and "i bet he cheated" would do the same.
    regex:
    - bet you can'?t
    # Anchored, or negated-and-aimed. "prove it" alone is most often about something else entirely;
    # as a challenge to her it stands alone or follows a "then".
    - ^(?:then )?prove it$
    - prove it to me\b
    - i dare you
    - you can'?t (?:do|beat|handle)
    - fight me
    - try me
    # Not "you bet": that is agreement ("you bet your life he did"), the opposite of a challenge.
    # A bare "bet." is the real one -- it means "watch me" -- so it gets the anchor.
    - '(?:wanna|want to|you wanna) bet\b'
    - ^bet$
    - come at me
    - '(?:bring|brought) it on?\b'
  examples:
  - go on then, show me you can actually do it
  - there is no way you manage that
  pool: user_challenge
  affect:
    amusement: 1.0
    confidence: 1.0
- id: KYS
  match:
    regex:
    - k+y+s+
    - kill yourself
    - neck yourself
  pool: user_kys
  push: argument
  affect:
    anger: 4.0
    trust: -2.0
    grudge: 2.0
- id: THREAT
  match:
    regex:
    - i'?ll (?:end|destroy|find|beat|kill|hurt) you
    - i'?m (?:gonna|going to) (?:kill|destroy|hurt|end|beat) you
    # "Either you speak normal or I'll make you" drew "that's what you interrupted me for?" -- a
    # threat answered as small talk. The verb above needs an object; this one's object is the
    # demand in front of it, so "make you" ends the clause and the pattern above cannot reach it.
    # Worth fixing beyond tone: user_threat carries the anger and the argument push, so a threat
    # she does not recognise also leaves her mood wrong for the turns after it.
    - (?:or|then) i'?ll make (?:you|u)\b
    - i'?ll make (?:you|u) (?:talk|behave|listen|stop|regret)\b
    - watch your (?:back|mouth)
    - kick your
    # Declaring the intent to threaten, rather than threatening. Two corpus rows ("i do immensive
    # menace speech towards you", "very life threatening speech") drew neutral lines -- the second
    # one literally filed life-threatening speech under 'don't care'. user_threat is authored for
    # this and needs no new lines. "a menace to society" and "threat level midnight" do not match:
    # the noun `speech` has to follow.
    - (?:menace|menacing|threat(?:en|ening)?|life ?threatening) spe+ch
  examples:
  - keep talking and see what happens to you
  - you are going to regret saying that to me
  pool: user_threat
  push: argument
  affect:
    anger: 3.0
    trust: -1.0
    grudge: 1.5
# "You mom fat" reached the fallback: the v1 patterns cover "your mom" and "yo mama" but not the
# dropped r, which is how the joke is typed at least as often. Same joke, same answer.
- id: YOURMOM
  match:
    regex:
    - yo+ ?ma(?:ma|mma)
    - you'?r? mom
    - ur mom
    - ya mum
  pool: joke_your_mom
  affect:
    anger: 1.0
    amusement: 1.0
- id: USER_GUILT
  match:
    regex:
    - you (?:made|make) me
    - it'?s your fault
    - because of you
    - you should feel bad
    - how could you
    - you owe me
  examples:
  - i would not even be in this mess if you had helped properly
  - after everything i put up with from you, really
  pool: user_guilt
