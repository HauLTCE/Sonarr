name: build

on:
  push:
    # The rewrite lives on feat/dotnet-rewrite until cutover; CI that only watches main
    # would sit idle for the whole rewrite, which is exactly when it is needed.
    branches: [main, feat/dotnet-rewrite]
  pull_request:
  workflow_dispatch:

# A force-push mid-run should cancel the run it superseded rather than race it to GHCR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      # Every action here is on its current major. They were a major behind, which is what emitted
      # "Node 20 is being deprecated" on every run: the version warned about is the Node the *action*
      # runs on, not anything this repo picks, so the fix is the bump and not
      # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION — that flag only silences the notice while keeping
      # the runtime that is going away.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Sonarr.slnx

      - run: dotnet build Sonarr.slnx --no-restore -warnaserror:NU1903

      # The engine behavior catalog and the persona lint are the gate (docs/checklist.md).
      # Both are already inside this one command and need no separate step: the catalog is
      # Sonarr.Elaine.Tests/BehaviorCatalogTests, and SeedPersonaTests runs the full
      # PersonaValidator against the real persona/ directory off disk — so a persona edit
      # that breaks an intent fails here, on the same run, with the validator's own report.
      - run: dotnet test Sonarr.slnx --no-build --verbosity minimal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24, not 22: `npm test` runs the type-stripping test runner directly on .ts, which needs
          # no flag from 23 on. On 22 it errors out with "Unknown file extension .ts".
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # tsc separately from the build: Turbopack does not typecheck, so a type error would
      # otherwise ship.
      - run: npx tsc --noEmit

      - run: npm run lint

      # Before the build, because it is the faster failure. These cover the formatters, whose Intl
      # options are only validated when a row renders — `hour()` mixed `dateStyle` with `hour`, which
      # throws, and tsc/eslint/next build all passed while the Stats page 500'd in production.
      - run: npm test

      - run: npm run build

  # Images publish only from a real push to a tracked branch — a PR from a fork must not be
  # able to write to the registry.
  images:
    needs: [dotnet, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: sonarr-bot
            context: .
            dockerfile: src/Sonarr.Bot/Dockerfile
          - name: sonarr-web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because GHCR rejects an uppercase path and the repo owner is not.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's own cache, so a rebuild after a one-line change does not redo
          # `npm ci` or `dotnet restore`.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
