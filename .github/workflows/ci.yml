name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Sonarr.slnx

      - run: dotnet build Sonarr.slnx --no-restore -warnaserror:NU1903

      # The engine behavior catalog and persona lint are the gate
      # (docs/checklist.md — CI). A red test here blocks the merge.
      - run: dotnet test Sonarr.slnx --no-build --verbosity minimal
