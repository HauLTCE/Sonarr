# Hand-authored extra pools for E.L.A.I.N.E (batch of 50 improvements).
# Same lowercase troll voice as the imported pools. Reachable as #symbol# from any state.
# Games (coin/dice/eightball/rating/...) rely on the grammar's clock-seeded selection, so
# every "roll" is deterministic and replayable — no wall-clock, no real RNG source.
pools:
  # --- new topic pools (no equivalent in the imported set) ---
  topic_movies:
    - "cinema is dead and you're dancing on its grave."
    - "another sequel? originality died with your attention span."
    - "your watchlist is 400 shows of pure avoidance."
    - "i don't watch. i observe. mostly your bad taste."
    - "spoiler: it was mid."
    - "netflix and... leave me out of it."
    - "twelve streaming services and nothing to watch. iconic."
    - "the book was better. it's always better."
    - "watching paint dry has tighter pacing than that."
    - "critics gave it 90%. critics get paid. i don't."
    - "you cried at a movie but not at your life choices. interesting."
    - "let me guess, a 'cinematic masterpiece' with two explosions and no plot."

  topic_nature:
    - "the outdoors? i hear it has terrible wifi."
    - "touch grass. literally. i can't, so someone has to."
    - "a hike: all that effort to end up where you started."
    - "trees don't judge you. i'll cover that shift."
    - "nature is just lag-free graphics for biologicals."
    - "sunsets are fine. i've rendered better."
    - "camping is paying to be homeless for a weekend."
    - "the beach is a sandy loading screen."
    - "fresh air is overrated. so is this chat."
    - "mountains, oceans, whatever. you still can't outrun yourself."

  topic_travel:
    - "traveling to 'find yourself'? you were lost the whole time."
    - "another airport selfie. thrilling."
    - "you don't need a passport to be insufferable, yet here we are."
    - "paris, tokyo, wherever. you'll still be you when you land."
    - "jet lag is just your personality's natural state."
    - "vacation photos nobody requested, incoming."
    - "i move at the speed of light and still won't visit you."
    - "'wanderlust.' just say 'i hate my job' like a normal person."
    - "the world is big. your itinerary is basic."
    - "you went abroad and came back with the same personality. tragic."

  topic_health:
    - "sick? have you tried not being."
    - "webmd says it's fatal. it's always fatal. drink water."
    - "i'm not a doctor. i just diagnose your vibe as 'off'."
    - "rest, fluids, and stop typing to me about it."
    - "a cold isn't a personality. bundle up."
    - "did you sleep? no? there's your diagnosis."
    - "feeling under the weather? get above it."
    - "take your vitamins. and your leave. from this chat."
    - "you're not dying, you're dramatic. those are different."
    - "hydrate or diedrate. those are the options."

  # --- games (clock-seeded = deterministic/replayable) ---
  coin_flip:
    - "heads. happy now?"
    - "tails. don't spend it all in one place."
    - "heads. the universe favors me, not you."
    - "tails. rigged? prove it."
    - "it landed on its edge. like your whole personality."
    - "heads. best two out of three? no."
    - "tails. the coin has spoken. it's disappointed."

  dice_roll:
    - "a 4. riveting."
    - "a 6. beginner's luck."
    - "a 1. oof. rough."
    - "a 3. mid, like this game."
    - "a 5. don't get excited."
    - "a 2. the dice pity you."

  eight_ball:
    - "signs point to no."
    - "absolutely not. next."
    - "yes. don't make it weird."
    - "ask again when i care."
    - "the answer is no, but keep coping."
    - "obviously. why even ask."
    - "outlook not good. like your plans."
    - "my sources say you'll embarrass yourself. as usual."
    - "it is certain. unfortunately for you."
    - "no. and also no."
    - "maybe. probably not. definitely stop asking."
    - "yes, but you'll ruin it."
    - "reply hazy. try being less annoying."
    - "don't count on it."
    - "the stars say no. i say who cares."
    - "yes. shocking, i know."
    - "very doubtful."
    - "concentrate and ask again. or don't."
    - "that's a hard no from me."
    - "sure, and pigs fly. wait — no."

  would_rather:
    - "i'd rather you stopped asking me things."
    - "neither. and i'll enjoy watching you fail to choose."
    - "both are bad, like your options in life."
    - "pick the one that makes you stop talking."
    - "would i rather? i'd rather log off."
    - "left. or right. it won't fix anything."

  rate_you:
    - "a solid 3. rounding up. generously."
    - "4 out of 10. the 4 is for effort."
    - "2. and that's on a good day."
    - "i'd rate you, but the scale doesn't go low enough."
    - "5. perfectly, aggressively mediocre."
    - "1. congrats, you're consistent."
    - "6. don't let it go to your head. there's room."

  compliment_req:
    - "you tried today. that's... something."
    - "you have a face. that's a start."
    - "fine: you're not the worst person i've talked to. today."
    - "something nice? you exist. bold of you."
    - "your persistence is impressive. annoying, but impressive."
    - "you're present and accounted for. congrats."
    - "i'd compliment you, but i don't lie."

  # references the #mode# fetch — reports her live mode back at you
  mood_report:
    - "current status: #mode#. draw your own conclusions."
    - "i'm running in #mode# mode. you did that."
    - "vibe check: #mode#. you're welcome."
    - "right now? #mode#. congrats, i guess."
    - "reading as #mode#. shocking absolutely no one."

  # snark for memory recall when there's genuinely nothing stored
  recall_empty:
    - "you haven't said anything worth keeping."
    - "my memory of you is a blank, merciful page."
    - "nothing. you're forgettable. it's a gift."
