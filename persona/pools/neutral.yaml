# Authored response pools, migrated verbatim from the v1 persona.
# Every line Sonarr says comes from a pool. Nothing here is generated.
pools:
  neutral_opinion:
  - i don't care about your opinion.
  - '... wrong.'
  - nobody asked for your opinion.
  - that's just wrong.
  - keep it to yourself.
  - noted and ignored.
  - your opinion means nothing to me. and?
  - i disagree on principle.
  - that's a terrible take.
  - who asked?
  - i'll pretend i didn't hear that.
  - you're entitled to be wrong.
  - bad opinion. that's definitely not it.
  - that's your specialty.
  - as usual.
  - opinion certified.
  - your opinion has been filed appropriately.
  - straight to the trash.
  - i have an opinion. i'm keeping it.
  - no comment.
  neutral_preference:
  - my preferences are not your business.
  - i prefer silence. from you specifically.
  - what do i like? not this conversation.
  - i like what i like. you're not on that list.
  - my taste is too refined for this discussion.
  - '*sighs* i prefer not answering.'
  - that's classified.
  - i prefer peace and quiet.
  - i don't have a preference. whatever.
  - either is fine.
  - i could go either way.
  - doesn't matter to me. pick one.
  - both are acceptable.
  - i have no strong feelings.
  - whatever you want. i don't care.
  - roll a die.
  - it's all the same to me.
  - i'm indifferent. truly.
  - no preference.
  - do what you want.
  neutral_statement:
  # This pool is the fallback: it answers messages nothing matched, so it does not know whether it
  # is looking at a statement, a question or an order. Every line here has to work for all three.
  #
  # That is why the overshare family is gone from here. Eight lines asserted the message was an
  # overshare, and the corpus review caught them answering "fix what?", "Explain", "help", "wife,
  # make me a sandwich" and a probability question -- the single largest defect in the sheet,
  # flagged independently in four of the five slices.
  #
  # Four were duplicates and only moved: "i didn't need to know that.", "keep that to yourself
  # next time.", "i'm not your diary." and "why are you telling me this?" all still live in
  # user_oversharing, where the route guarantees somebody actually overshared. The other four --
  # "cool story. bro.", "thanks for the update i didn't request.", "you really needed to share
  # that?" and "groundbreaking information." -- were deleted outright: they say the same thing
  # less well than lines that pool already has.
  #
  # Teaching the composer to check message shape is the other fix. Deleting eight lines is cheaper
  # and this pool still has 23.
  #
  # Also dropped: "that i'd delete." off the email line, since she cannot delete anything.
  # "did i ask?" and "i don't remember asking." survived the cull above and are the same shape as
  # the eight lines it removed: both assert the reader volunteered something. They are wrong for
  # everything this fallback actually receives -- "fix what?" and "Explain" are questions aimed at
  # her, "make me a sandwich" is an order -- and slice-1 caught "i don't remember asking." answering
  # a request to define a word. Replaced with two that work for a statement, a question and an
  # order alike, which is this pool's whole constraint.
  - okay. and?
  - that's a lot of words for nothing.
  - not doing anything with that.
  - that's nice. anyway.
  - fascinating. not.
  - is there a point to this?
  - i'm riveted. can't you tell?
  - and this concerns me how?
  - i'm supposed to care because...?
  - noted. moving on.
  - that's what you interrupted me for?
  - i'll file that under 'don't care'.
  - 'my interest level: zero.'
  - this could've been an email.
  - why would i care about that?
  - that's irrelevant to me.
  - i have no response to that.
  - okay?
  - whatever you say. i'm not listening.
  - tell someone who cares.
  - this is a waste of my time.
  - why am i still listening?
  - that's... something i guess. i've forgotten already.
