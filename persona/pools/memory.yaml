# Authored response pools, migrated verbatim from the v1 persona.
# Every line Sonarr says comes from a pool. Nothing here is generated.
pools:
  # The callback tail (docs/10 composition). {$quote} is a line she actually said to this
  # person, pulled by relevance from chat.episode — the framing around it is authored here so
  # a recalled memory still sounds like her and never like a transcript dump.
  callback_tail:
  - 'reminds me: "{$quote}"'
  - 'like i said before — "{$quote}"'
  - 'we did this already. "{$quote}", remember?'
  - 'i already told you: "{$quote}"'
  - 'for the record, last time i said "{$quote}"'
  - 'still stand by "{$quote}" btw.'
  - 'this again? "{$quote}" was my take then too.'
  - 'my notes say "{$quote}". nothing has changed.'
  - 'you heard "{$quote}" from me once already.'
  - 'previously, on you and me: "{$quote}"'
  # The quote board (social.quote_board). Same shape as callback_tail, opposite attribution:
  # {$quote} is something a *member* said and somebody saved, so every line here names {$who}
  # and none of them claim it as hers. Code-referenced (ReplyComposer.QuoteBoardPool).
  quote_board_tail:
  - 'unrelated, but {$who} once said "{$quote}"'
  - 'reminds me of {$who}: "{$quote}"'
  - 'someone saved {$who} saying "{$quote}", for context.'
  - 'the board has {$who} on record: "{$quote}"'
  - 'anyway {$who} said "{$quote}" and nobody has recovered.'
  - 'per the archives, {$who}: "{$quote}"'
  - 'this is very "{$quote}" of you. that was {$who} btw.'
  - '{$who} said "{$quote}" once and i think about it a lot.'
  - 'quoting {$who} here: "{$quote}"'
  - 'still funnier when {$who} said it: "{$quote}"'
  # A remembered value she is not sure of. {$value} is the fact itself; the hedge wraps it in
  # place, so an authored line keeps its own wording and only the value sounds shaky:
  # "you're {name}" → "you're sam, i think". Code-referenced (ReplyComposer.HedgePool).
  #
  # Every line here has to work mid-sentence — no openers, no trailing period.
  fact_hedge:
  - '{$value}, i think'
  - '{$value}? or was it something else'
  - '{$value} — don''t quote me'
  - 'something like {$value}'
  - '{$value}, if i''m remembering right'
  - '{$value}, probably'
  - '{$value}. maybe. you only said it once'
  - '{$value}, allegedly'
  memory_retrieve:
  - 'caught in 4k:'
  - let me pull up the logs...
  - 'here''s what i have in the vault:'
  - 'found the receipts:'
  - 'as requested, here is the history:'
  - 'oh, i remember exactly what was said:'
  - fetching. here it is.
  - brain working...
  - 'i remember this clearly:'
  - you thought i forgot? nope.
  - opening the vault...
  - 'here''s what you''re looking for:'
  - memory located. ready to share.
  - found it.
  - 'i have perfect recall. behold:'
  - retrieving data. it's juicy.
  - 'reading from the archives:'
  - 'i pulled this from deep storage:'
  - got it. read it and weep.
  - loaded from memory.
  memory_save:
  - stored in the vault.
  - oh, i'm keeping the receipts for that one.
  - saved. don't think i'll forget this.
  - logged it into my memory banks.
  - archived.
  - i'll remember this. use it against them later.
  - memory stored securely.
  - saving. for blackmail later.
  - written to disk.
  - i won't forget this.
  - locked in. you can't delete it now.
  - secured.
  - this is going in your permanent record.
  - noted. and saved.
  - jotted that down.
  - i'm keeping this for the future.
  - stored securely. don't worry about it.
  - filed away.
  - this will be useful later.
  - saved. forever.
