# Lavalink node config. Copied verbatim off the CT on 2026-07-28 (the config that has been
# serving music since May) with one change: the password is no longer hardcoded here.
#
# Lavalink is Spring Boot, so any key can be overridden by an env var with the path
# uppercased and dots/dashes turned into underscores. compose passes
# LAVALINK_SERVER_PASSWORD from .env, which is why this file is safe to commit.
server:
  port: 2333
  # Loopback only. This was 0.0.0.0 so the legacy Python bot could dial the box's LAN
  # address; that bot is gone (cutover 2026-07-28), and with network_mode: host the .NET
  # bot reaches the node over loopback. An audio node reachable from the LAN is a remote
  # code path guarded by one shared secret, so don't widen this without a reason.
  # If a rollback ever needs the old bot again, set LAVALINK_URI to 127.0.0.1 there too
  # rather than reopening this.
  address: 127.0.0.1
lavalink:
  plugins:
    # 1.18.2, not 1.18.1: 1.18.1 logged "A newer version was found" on every boot and carries
    # a broken itag 18 playback path. Bump deliberately when YouTube breaks playback, same rule
    # as the yt-cipher digest — there is no plugins volume, so a recreate re-downloads this jar.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    # Overridden by LAVALINK_SERVER_PASSWORD; the placeholder keeps the file valid standalone.
    # No default on purpose. The upstream sample ships `youshallnotpass` and this file used to
    # keep it as a fallback, which is how the node ended up genuinely running on the default
    # password at cutover — Lavalink4NET warned about it in the bot log and nothing else did.
    # compose passes LAVALINK_SERVER_PASSWORD with `:?required`, so an unset value now fails
    # the node's startup instead of quietly making it world-openable.
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Built-in youtube source off on purpose: the youtube-plugin below replaces it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    remoteCipher:
      # The yt-cipher container in this same stack. Loopback works because both run with
      # network_mode: host — this is the coupling that makes them one unit.
      url: "http://127.0.0.1:8001/"
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Tried top-down. MUSIC is search-only (it serves ytmsearch:), so the first client that can
    # actually stream is the one that decides whether playback works.
    #
    # TVHTML5EMBEDDED used to sit at position two and is not a real client identifier: the plugin
    # logged "Failed to resolve TVHTML5EMBEDDED into a Client" on every boot and ran with three
    # clients instead of four. Fixing the spelling to TVHTML5_SIMPLY buys back a client that has
    # Opus, playback and age-restricted support and needs neither OAuth nor a poToken.
    #
    # Do NOT read this as the cure for the 2026-07-29 outage. Every track that day died with
    # AllClientsFailedException (WEB: "No supported audio streams available", i.e. SABR-only
    # responses; ANDROID_VR: "This video requires login"), but restoring this exact broken list
    # afterwards played those same videos fine — so the outage was a transient YouTube-side
    # condition, not this typo. The depth here is margin, not a fix: with only WEB and ANDROID_VR
    # live, one bad day at YouTube takes all of playback down, which is what happened.
    clients:
      - MUSIC
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB

logging:
  level:
    lavalink.server: INFO
    dev.lavalink.youtube: INFO
