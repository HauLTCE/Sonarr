    - raining
    - sunny
    - snowing
    - cloudy
    - humid
    - freezing
    regex:
    - it'?s (?:hot|cold|raining|snowing|sunny)
    - so (?:hot|cold) (?:out|today)
    - nice out
    - the temperature
