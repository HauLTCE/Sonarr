# emotions intents — migrated from the v1 persona, CHAT state (deleted tree; read it with
# `git show python-bot-final:_bot_legacy/elaine/persona/elaine.yaml`).
# Patterns carry over verbatim; Python (?P<x>) named groups rewritten to .NET (?<x>).
intents:
- id: BRAG
  match:
    regex:
    - i(?:'?m| am) (?:the )?(?:best|smartest|richest|greatest)
    - i(?:'?m| am) better than
    - i(?:'?m| am) (?:so )?rich
    - i(?:'?m| am) a genius
  pool: user_bragging
  affect:
    amusement: 1.0
- id: SAD
  match:
    keyword:
    - sad
    - depressed
    - crying
    - upset
    - unhappy
    - miserable
    - lonely
    - heartbroken
    - hopeless
    - grieving
    - devastated
    regex:
    - feel(?:ing)? (?:down|low|bad|awful|terrible|horrible)
    - i lost my
    - i failed
    - going through
    - hate my life
    - want to cry
    - died
    - passed away
    - (?:he|she|they|it) is dead
  # Phrasings with none of the keywords above — what the semantic tier exists to catch.
  examples:
  - everything in my life is falling apart right now
  - i just want to sit in the dark and not talk to anyone
  - nothing has gone right for me in weeks
  pool: user_venting
- id: TIRED
  match:
    keyword:
    - tired
    - exhausted
    - sleepy
    - drained
    - burnt
    regex:
    - can'?t sleep
    - cant sleep
    - no sleep
    - so tired
    - need (?:a nap|sleep|rest)
    - up all night
    - didn'?t sleep
  examples:
  - i have been awake for way too long and my brain is done
  - running on three hours of sleep and an energy drink
  pool: user_tired
- id: HAPPY
  match:
    keyword:
    - happy
    - excited
    - stoked
    - thrilled
    - ecstatic
    - pumped
    - hyped
    - yay
    - woohoo
    - elated
    regex:
    - so happy
    - best day
    - great news
    - can'?t wait
    - cant wait
  pool: user_happy
- id: CONFUSED
  match:
    keyword:
    - confused
    - huh
    regex:
    - i (?:don'?t|do not|dont) (?:understand|get it|get this)
    - what do you mean
    - makes no sense
    - i'?m lost
    - im lost
    - (?:don'?t|dont) know what to do
    - no idea
  examples:
  - you have completely lost me, run that past me again
  - none of what you just said connects for me
  pool: user_confused
- id: BORED_IN
  match:
    keyword:
    - bored
    - boring
    - dull
    regex:
    - nothing to do
  examples:
  - i have refreshed every app twice and there is still nothing happening
  - entertain me, this afternoon is dragging
  pool: user_bored
  affect:
    boredom: 2.0
- id: USER_ANGRY
  match:
    keyword:
    - angry
    - mad
    - furious
    - pissed
    - livid
    - fuming
    regex:
    - so (?:mad|angry)
    - i'?m (?:so )?(?:mad|angry|furious|pissed)
    - makes me (?:mad|angry)
  examples:
  - i want to throw my laptop across the room
  - if one more person does that to me today i am going to lose it
  pool: user_angry
- id: USER_PANIC
  match:
    keyword:
    - panicking
    - panic
    - anxious
    - anxiety
    - overwhelmed
    - stressed
    regex:
    - freaking out
    - can'?t breathe
    - having a breakdown
    - so stressed
    - losing it
  examples:
  - my heart is racing and i cannot sit still
  - there is way too much on my plate and the deadline is tomorrow
  pool: user_panicking
- id: USER_JEALOUS
  match:
    keyword:
    - jealous
    - envious
    - envy
    regex:
    - so jealous
    - wish i had
    - why do they get
  pool: user_jealousy
- id: USER_EXCITE
  match:
    keyword:
    - omg
    - omfg
    - yesss
    - letsgo
    - woohoo
    regex:
    - guess what
    - so excited
    - best news
    - can'?t believe
    - let'?s go+
  examples:
  - i finally got the thing i have been working towards for months
  - you will not believe what just happened to me
  pool: user_excitement
- id: USER_VALIDATION
  match:
    regex:
    - am i right
    - tell me i'?m
    - aren'?t i
    - validate me
    - i need validation
    - make me feel better
    - reassure me
  examples:
  - please just tell me i did the right thing here
  - i need someone to say this was not my fault
  pool: user_validation_seeking
- id: USER_OVERSHARE
  match:
    keyword:
    - tmi
    regex:
    - too much information
    - why am i telling you
    - no one asked but
    - probably shouldn'?t say
    - between you and me
  pool: user_oversharing
- id: USER_SARCASM
  match:
    regex:
    - yeah right
    - oh (?:great|wonderful|fantastic|joy|lovely)
    - how (?:nice|lovely) for you
    - sure you did
    - totally believe you
    - wow so (?:cool|amazing)
  pool: user_sarcasm
  affect:
    amusement: 1.0
- id: USER_SUSPICIOUS
  match:
    keyword:
    - sus
    - suspicious
    - sketchy
    - shady
    - fishy
    regex:
    - are you sure
    - i don'?t trust
    - something'?s off
    - up to something
    - you'?re hiding
  pool: user_suspicious
