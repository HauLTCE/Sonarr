# Prod stack — lives at /root/sonarr-net/docker-compose.yml on the server (docs/11-deployment.md).
#
# MUSIC STACK IS DELIBERATELY ABSENT. Lavalink 4.2.2 (systemd `lavalink.service`),
# yt-cipher (its own container) and /root/lavalink/* stay on the host, untouched forever.
# The bot reaches them over localhost thanks to `network_mode: host`. Never add them here.
name: sonarr

services:
  bot:
    image: ${BOT_IMAGE:-sonarr-bot:local}
    # Built by deploy/deploy.sh, which rsyncs the sources into ./repo; GHCR pull once CI lands.
    build:
      context: ./repo
      dockerfile: src/Sonarr.Bot/Dockerfile
    # Host networking: same reachability the old systemd bot had (Lavalink on 127.0.0.1:2333).
    # Side effect: the API listens on the host's :5088 directly — no port mapping applies.
    network_mode: host
    env_file: .env
    volumes:
      - ./persona:/app/persona          # hot-reloadable persona (docs/10)
      - ./models:/app/models:ro         # ONNX embedder, fetched by scripts/fetch-model.sh (docs/03)
      - /root/backups/sonarr:/backups   # BackupRunner writes here (docs/11)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-sonarr-web:local}
    # Same ./repo tree deploy.sh rsyncs for the bot image; web/ rides along.
    build:
      context: ./repo/web
      dockerfile: Dockerfile
    # Host networking, like the bot: that is what makes 127.0.0.1:5088 below the API rather
    # than this container talking to itself. No port mapping applies as a result — HOSTNAME
    # is what keeps :3000 on loopback, where the user's tunnel picks it up.
    network_mode: host
    environment:
      # Server-side calls only; the panel never gets DB creds or the Discord token (docs/06).
      SONARR_API_URL: http://127.0.0.1:5088
      HOSTNAME: 127.0.0.1       # user's tunnel maps sonarr.hault.io.vn -> :3000
      PORT: 3000
    depends_on: [bot]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:5432:5432"   # loopback only; bot uses host networking so it reaches this fine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
